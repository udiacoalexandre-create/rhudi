name: Deploy Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy para o Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          out=$(npx -y firebase-tools@latest deploy --only hosting --project udiaco-beneficios 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then exit 0; fi
          # "is the current active version" = conteúdo idêntico ao que já está no ar (benigno)
          if echo "$out" | grep -q "is the current active version"; then
            echo "::notice::Nada novo para publicar — o site já está com esta versão."
            exit 0
          fi
          exit $code
      # Sem "|| true" nem continue-on-error: mascarar a falha aqui deixou as
      # regras paradas em 20/07/2026 enquanto o deploy aparecia como verde, e
      # coleção nova ficava barrada ("Missing or insufficient permissions").
      - name: Publicar regras do Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx -y firebase-tools@latest deploy --only firestore:rules --project udiaco-beneficios
