<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #F0F2F5;
  --surface: #FFFFFF;
  --surface2: #F8F9FB;
  --border: #E4E7EC;
  --text: #101828;
  --text2: #667085;
  --text3: #98A2B3;
  --blue: #1D4ED8;
  --blue-light: #EFF6FF;
  --blue-dark: #1E3A8A;
  --green: #059669;
  --green-light: #ECFDF5;
  --red: #DC2626;
  --red-light: #FEF2F2;
  --yellow: #D97706;
  --yellow-light: #FFFBEB;
  --orange: #EA580C;
  --orange-light: #FFF7ED;
  --purple: #7C3AED;
  --purple-light: #F5F3FF;
  --shadow-sm: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.06);
  --shadow: 0 4px 8px -2px rgba(16,24,40,.1), 0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-lg: 0 12px 24px -4px rgba(16,24,40,.12), 0 8px 12px -4px rgba(16,24,40,.08);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* ══ LOGIN ══ */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; position: fixed; inset: 0; z-index: 999;
  background: linear-gradient(135deg, #1E3A8A 0%, #1D4ED8 50%, #2563EB 100%);
}
.login-card {
  background: #fff; border-radius: 20px; padding: 44px;
  width: 400px; box-shadow: var(--shadow-lg);
}
.login-logo { text-align: center; margin-bottom: 8px; font-size: 48px; }
.login-title { text-align: center; font-size: 22px; font-weight: 700; color: var(--blue-dark); margin-bottom: 4px; }
.login-sub { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 32px; }
.login-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
.login-input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-family: 'Inter', sans-serif;
  font-size: 14px; color: var(--text); background: var(--surface2);
  transition: border-color .15s, box-shadow .15s; margin-bottom: 16px;
}
.login-input:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(29,78,216,.1); }
.login-btn {
  width: 100%; padding: 12px; background: var(--blue); color: #fff;
  border: none; border-radius: var(--radius-sm); font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s;
  margin-top: 4px;
}
.login-btn:hover { background: var(--blue-dark); }
.login-error { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; display: none; padding: 8px; background: var(--red-light); border-radius: var(--radius-sm); }

/* ══ APP ══ */
#app-screen { display: none; min-height: 100vh; flex-direction: column; }

/* TOPBAR */
.topbar {
  background: var(--blue-dark); height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 24px; flex-shrink: 0; position: sticky; top: 0; z-index: 50;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-brand .logo { font-size: 24px; }
.topbar-brand h1 { font-size: 15px; font-weight: 700; color: #fff; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-user { font-size: 12px; color: rgba(255,255,255,.6); }
.topbar-sync { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,.1); color: #fff; }
.topbar-sync.ok { background: rgba(5,150,105,.4); }
.topbar-sync.err { background: rgba(220,38,38,.4); }
.btn-logout { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); border: none; padding: 6px 14px; border-radius: var(--radius-sm); font-family: 'Inter',sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: background .15s; }
.btn-logout:hover { background: rgba(255,255,255,.2); }

/* MODULE TABS */
.module-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; padding: 0 24px; gap: 2px; flex-shrink: 0;
  position: sticky; top: 56px; z-index: 40;
}
.mod-tab {
  display: flex; align-items: center; gap: 8px; padding: 14px 20px;
  font-size: 13px; font-weight: 500; color: var(--text2);
  cursor: pointer; border-bottom: 3px solid transparent;
  transition: all .15s; white-space: nowrap; background: none; border-left: none; border-right: none; border-top: none;
  font-family: 'Inter', sans-serif;
}
.mod-tab:hover { color: var(--blue); background: var(--blue-light); }
.mod-tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.mod-tab .mod-icon { font-size: 16px; }

/* LAYOUT */
.app-body { display: flex; flex: 1; min-height: calc(100vh - 104px); }
.sidebar {
  width: 220px; background: var(--surface); border-right: 1px solid var(--border);
  padding: 16px 0; flex-shrink: 0; overflow-y: auto;
  position: sticky; top: 104px; height: calc(100vh - 104px);
}
.sidebar-group { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; padding: 8px 16px 4px; }
.sidebar-sep { height: 1px; background: var(--border); margin: 8px 12px; }
.sidebar-btn {
  width: 100%; padding: 9px 16px; text-align: left; background: none; border: none;
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text2);
  cursor: pointer; display: flex; align-items: center; gap: 9px;
  transition: all .15s; border-radius: 0;
}
.sidebar-btn:hover { background: var(--bg); color: var(--text); }
.sidebar-btn.active { background: var(--blue-light); color: var(--blue); font-weight: 600; border-right: 3px solid var(--blue); }
.sidebar-btn .s-icon { font-size: 15px; flex-shrink: 0; }

/* MAIN */
.main-content { flex: 1; padding: 24px; overflow-y: auto; }
.page { display: none; }
.page.active { display: block; }

/* PAGE HEADER */
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.page-header p { font-size: 13px; color: var(--text2); }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
.card-header { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; }

/* STATS GRID */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow-sm); }
.stat-card.blue { border-left: 4px solid var(--blue); }
.stat-card.green { border-left: 4px solid var(--green); }
.stat-card.red { border-left: 4px solid var(--red); }
.stat-card.yellow { border-left: 4px solid var(--yellow); }
.stat-card.orange { border-left: 4px solid var(--orange); }
.stat-card.purple { border-left: 4px solid var(--purple); }
.stat-val { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 12px; color: var(--text2); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* FORMS */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.form-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.form-grid.cols3 { grid-template-columns: repeat(3, 1fr); }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg.span2 { grid-column: span 2; }
.fg.span3 { grid-column: span 3; }
.fg.full { grid-column: 1/-1; }
.fg label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; }
.fg input, .fg select, .fg textarea {
  padding: 8px 11px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
  background: var(--surface2); transition: border-color .15s;
}
.fg input:focus, .fg select:focus { outline: none; border-color: var(--blue); background: #fff; }
.section-sep { background: var(--blue-light); border-radius: var(--radius-sm); padding: 10px 14px; margin: 14px 0 10px; font-size: 12px; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 8px; }

/* BUTTONS */
.btn { padding: 8px 16px; border-radius: var(--radius-sm); border: none; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #047857; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #B91C1C; }
.btn-warning { background: var(--yellow); color: #fff; }
.btn-warning:hover { background: #B45309; }
.btn-ghost { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--bg); border-color: var(--text3); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* TABLES */
.tbl-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl thead th { background: var(--blue-dark); color: #fff; padding: 10px 12px; text-align: left; font-weight: 500; font-size: 11px; white-space: nowrap; }
.tbl tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
.tbl tbody tr:last-child { border-bottom: none; }
.tbl tbody tr:hover { background: var(--blue-light); }
.tbl tbody td { padding: 9px 12px; }

/* BADGES */
.badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.badge-green { background: var(--green-light); color: var(--green); }
.badge-red { background: var(--red-light); color: var(--red); }
.badge-blue { background: var(--blue-light); color: var(--blue); }
.badge-yellow { background: var(--yellow-light); color: var(--yellow); }
.badge-orange { background: var(--orange-light); color: var(--orange); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-gray { background: var(--bg); color: var(--text2); border: 1px solid var(--border); }

/* FILTER BAR */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; background: var(--surface); padding: 14px; border-radius: var(--radius); border: 1px solid var(--border); }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; }
.filter-group input, .filter-group select { padding: 7px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 12px; background: var(--surface2); color: var(--text); }
.filter-group input { min-width: 200px; }
.filter-group input:focus, .filter-group select:focus { outline: none; border-color: var(--blue); }
.filter-count { font-size: 12px; color: var(--text2); align-self: center; white-space: nowrap; }

/* UPLOAD ZONE */
.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; cursor: pointer; transition: all .2s; background: var(--surface2); }
.upload-zone:hover { border-color: var(--blue); background: var(--blue-light); }
.upload-zone input { display: none; }
.upload-icon { font-size: 36px; margin-bottom: 10px; }
.upload-text { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.upload-sub { font-size: 12px; color: var(--text2); }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius-lg); padding: 28px; width: 100%; max-width: 800px; box-shadow: var(--shadow-lg); margin-bottom: 40px; }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ALERTS */
.alert { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
.alert-info { background: var(--blue-light); color: var(--blue); border: 1px solid #BFDBFE; }
.alert-success { background: var(--green-light); color: var(--green); border: 1px solid #A7F3D0; }
.alert-warning { background: var(--yellow-light); color: var(--yellow); border: 1px solid #FDE68A; }
.alert-danger { background: var(--red-light); color: var(--red); border: 1px solid #FECACA; }

/* TOAST */
#toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: all .25s; z-index: 999; pointer-events: none; max-width: 360px; box-shadow: var(--shadow-lg); }
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { background: var(--green); color: #fff; }
#toast.error { background: var(--red); color: #fff; }
#toast.warning { background: var(--yellow); color: #fff; }
#toast.info { background: var(--blue); color: #fff; }

/* CHECKBOX GROUP */
.check-group { display: flex; flex-wrap: wrap; gap: 10px; }
.check-item { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all .15s; background: var(--surface2); }
.check-item:hover { border-color: var(--blue); background: var(--blue-light); }
.check-item input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--blue); }
.check-item label { font-size: 13px; font-weight: 500; cursor: pointer; }
.check-item.checked { border-color: var(--blue); background: var(--blue-light); }

/* EXPORT GRID */
.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.export-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; transition: all .15s; }
.export-card:hover { border-color: var(--blue); box-shadow: var(--shadow); }
.export-card .ex-icon { font-size: 30px; margin-bottom: 10px; }
.export-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.export-card p { font-size: 11px; color: var(--text2); margin-bottom: 14px; }

/* LAUNCH TABLE */
.launch-tbl thead th { font-size: 10px; padding: 7px 6px; }
.launch-tbl td { padding: 4px 5px; }
.launch-tbl input[type="number"] { width: 52px; padding: 3px 5px; border: 1.5px solid var(--border); border-radius: 4px; font-size: 11px; text-align: center; font-family: 'JetBrains Mono', monospace; background: var(--surface2); }
.launch-tbl input[type="number"]:focus { outline: none; border-color: var(--blue); }
.input-du { background: #ECFDF5 !important; }
.input-falta { background: #FEF2F2 !important; }
.input-ferias { background: #FFFBEB !important; }
.input-extras { background: #F5F3FF !important; }
.cell-locked { background: #FEF9C3 !important; opacity: .8; }
.dias-reais { font-weight: 700; color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: center; }
.total-cell { font-weight: 600; color: var(--blue); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right; }
.total-row td { background: var(--blue-dark) !important; color: #fff; font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 8px 6px; }
.total-row-label td { background: #1E3A8A !important; color: rgba(255,255,255,.6); font-size: 10px; padding: 5px 6px; text-align: center; }

/* FÉRIAS RADAR */
.radar-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.radar-item { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; transition: all .15s; }
.radar-item:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.radar-dot { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.dot-green { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-orange { background: var(--orange); }
.dot-red { background: var(--red); }
.radar-name { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radar-venc { font-size: 10px; color: var(--text2); }
.radar-dias { font-size: 11px; font-weight: 600; margin-top: 4px; }

/* SENIOR SYNC CARDS */
.sync-card { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1.5px solid; }
.sync-novo { background: var(--green-light); border-color: #A7F3D0; }
.sync-demitido { background: var(--red-light); border-color: #FECACA; }
.sync-ferias-in { background: var(--blue-light); border-color: #BFDBFE; }
.sync-ferias-out { background: var(--yellow-light); border-color: #FDE68A; }
.sync-card-text { font-size: 13px; }
.sync-card-btns { display: flex; gap: 6px; flex-shrink: 0; }

/* VT TABLE */
.vt-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.vt-tbl th { background: var(--blue-light); color: var(--blue); padding: 7px 10px; text-align: left; font-weight: 600; font-size: 11px; }
.vt-tbl td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
.vt-tbl select, .vt-tbl input { padding: 4px 7px; border: 1.5px solid var(--border); border-radius: 4px; font-size: 11px; font-family: 'Inter', sans-serif; }

/* FOLHA TABLE */
.folha-wrap { max-height: 500px; overflow: auto; border-radius: var(--radius); border: 1px solid var(--border); }
.folha-tbl { border-collapse: collapse; font-size: 11px; }
.folha-tbl th { background: var(--blue-dark); color: #fff; padding: 8px 10px; font-weight: 500; font-size: 10px; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.folha-tbl td { padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-align: right; }
.folha-tbl td:nth-child(-n+4) { text-align: left; font-family: 'Inter', sans-serif; font-size: 11px; }
.folha-tbl tr:hover td { background: var(--blue-light); }
.folha-grupo { background: #1E3A8A; color: rgba(255,255,255,.6); font-size: 9px; text-transform: uppercase; letter-spacing: .5px; }

/* DASHBOARD */
.dash-section { margin-bottom: 24px; }
.dash-section-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

/* UTIL */

<script>

function processarSync(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let hi=0;
    for(let i=0;i<Math.min(5,data.length);i++){
      if(data[i].some(v=>String(v||'').toLowerCase().includes('nome'))){hi=i;break;}
    }
    const hs=data[hi].map(h=>String(h||'').toLowerCase().trim());
    const iMat=hs.findIndex(h=>h.includes('cadastro')||h.includes('matr'));
    const iNome=hs.findIndex(h=>h.includes('nome'));
    const iCPF=hs.findIndex(h=>h.includes('cpf'));
    const seniorMats=new Set();
    const seniorData=[];
    for(let i=hi+1;i<data.length;i++){
      const r=data[i]; if(!r||!r[iNome]) continue;
      const mat=String(r[iMat]||'').trim();
      const nome=String(r[iNome]||'').trim().toUpperCase();
      if(mat){seniorMats.add(mat);seniorData.push({mat,nome,cpf:String(r[iCPF]||'').trim()});}
    }
    const acoes=[];
    seniorData.forEach(s=>{
      if(!colaboradores.find(c=>c.mat===s.mat))
        acoes.push({tipo:'novo',dados:s});
    });
    colaboradores.filter(c=>c.status==='Ativo'&&c.mat).forEach(c=>{
      if(!seniorMats.has(c.mat))
        acoes.push({tipo:'demitido',dados:c});
    });
    colaboradores.filter(c=>['Ferias','Ferias'].includes(c.status)&&c.mat).forEach(c=>{
      if(seniorMats.has(c.mat))
        acoes.push({tipo:'voltou',dados:c});
    });
    seniorPendente=acoes;
    renderSyncPreview(seniorData.length);
    event.target.value='';
  };
  reader.readAsBinaryString(file);
}

function renderSyncPreview(total){
  const novos=seniorPendente.filter(a=>a.tipo==='novo');
  const demitidos=seniorPendente.filter(a=>a.tipo==='demitido');
  const voltaram=seniorPendente.filter(a=>a.tipo==='voltou');
  const prev=document.getElementById('sync-preview');
  if(!prev) return;
  if(seniorPendente.length===0){
    prev.innerHTML='<div class="alert alert-success">Relatorio lido: '+total+' colaboradores. Base sincronizada!</div>';
    return;
  }
  let html='<div class="alert alert-info">Relatorio lido: <strong>'+total+'</strong> colab. &middot; <strong>'+novos.length+'</strong> novos &middot; <strong>'+demitidos.length+'</strong> demissoes &middot; <strong>'+voltaram.length+'</strong> retornos</div>';
  html+='<div style="max-height:400px;overflow-y:auto">';
  novos.forEach((a,i)=>{
    html+='<div class="sync-card sync-novo"><div class="sync-card-text"><strong>Novo:</strong> '+a.dados.nome+' <code>'+a.dados.mat+'</code></div><div class="sync-card-btns"><button class="btn btn-success btn-sm" onclick="syncAcao(\'novo\','+i+')">Cadastrar</button><button class="btn btn-ghost btn-sm" onclick="syncIgnorar(\'novo\','+i+')">Ignorar</button></div></div>';
  });
  demitidos.forEach((a,i)=>{
    html+='<div class="sync-card sync-demitido"><div class="sync-card-text"><strong>Nao encontrado:</strong> '+a.dados.nome+' <code>'+a.dados.mat+'</code> foi demitido?</div><div class="sync-card-btns"><button class="btn btn-danger btn-sm" onclick="syncAcao(\'demitido\','+i+')">Inativo</button><button class="btn btn-warning btn-sm" onclick="syncAcaoFerias('+i+')">Ferias</button><button class="btn btn-ghost btn-sm" onclick="syncIgnorar(\'demitido\','+i+')">Ignorar</button></div></div>';
  });
  voltaram.forEach((a,i)=>{
    html+='<div class="sync-card sync-ferias-out"><div class="sync-card-text"><strong>Voltou de ferias?</strong> '+a.dados.nome+' <code>'+a.dados.mat+'</code></div><div class="sync-card-btns"><button class="btn btn-primary btn-sm" onclick="syncAcao(\'voltou\','+i+')">Marcar Ativo</button><button class="btn btn-ghost btn-sm" onclick="syncIgnorar(\'voltou\','+i+')">Ignorar</button></div></div>';
  });
  html+='</div>';
  prev.innerHTML=html;
}

async function syncAcao(tipo, idx){
  const item=seniorPendente.filter(a=>a.tipo===tipo)[idx];
  if(!item) return;
  if(tipo==='novo'){
    const d=item.dados;
    const id=d.mat||(d.nome.replace(/[^A-Za-z0-9]/g,'_').substr(0,20)+'_'+Date.now());
    const c={_id:id,mat:d.mat,nome:d.nome,cpf:d.cpf||'',status:'Ativo',mobilidade:'perto',
      elegibilidade:{vr:false,cafe:false,mobilidade:false,folha:true},
      vr:0,cafe:0,comb:0,vt1:0,v1:0,vt2:0,v2:0,vt3:0,v3:0,vt4:0,v4:0,cargo:'',depto:''};
    await fsSet('colaboradores',id,c);
    colaboradores.push(c);
    toast('✅ '+d.nome+' cadastrado!','success');
  } else if(tipo==='demitido'){
    const c=colaboradores.find(x=>x.mat===item.dados.mat); if(!c) return;
    c.status='Inativo';
    await fsSet('colaboradores',c._id,c);
    toast(c.nome+' marcado como Inativo.','warning');
  } else if(tipo==='voltou'){
    const c=colaboradores.find(x=>x._id===item.dados._id); if(!c) return;
    c.status='Ativo';
    await fsSet('colaboradores',c._id,c);
    toast(c.nome+' voltou às atividades!','success');
  }
  seniorPendente=seniorPendente.filter(a=>!(a.tipo===tipo&&a===item));
  renderSyncPreview(0);
}

async function syncAcaoFerias(idx){
  const item=seniorPendente.filter(a=>a.tipo==='demitido')[idx];
  if(!item) return;
  const c=colaboradores.find(x=>x.mat===item.dados.mat); if(!c) return;
  c.status='Férias';
  await fsSet('colaboradores',c._id,c);
  seniorPendente=seniorPendente.filter(a=>a!==item);
  toast(c.nome+' colocado em Férias.','info');
  renderSyncPreview(0);
}

function syncIgnorar(tipo, idx){
  const arr=seniorPendente.filter(a=>a.tipo===tipo);
  const item=arr[idx];
  seniorPendente=seniorPendente.filter(a=>a!==item);
  renderSyncPreview(0);
}

function pgBaseCarga(){

      </div>

        <input type="file" id="carga-file" accept=".xlsx,.xls" onchange="processarCarga(event)">
        <div class="upload-icon">📋</div>
        <div class="upload-text">Clique para selecionar a planilha</div>

      <div id="carga-preview" style="margin-top:14px"></div>

    <div class="card">
      <div class="card-title">Modelo de planilha</div>
      <button class="btn btn-success btn-sm" onclick="gerarModeloCarga()">⬇ Baixar modelo</button>
    </div>`;
}

function processarCarga(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let hi=0;
    for(let i=0;i<Math.min(5,data.length);i++){if(data[i].some(v=>String(v||'').toLowerCase().includes('nome'))){hi=i;break;}}
    const hs=data[hi].map(h=>String(h||'').toLowerCase().trim());
    const col=(...keys)=>hs.findIndex(h=>keys.some(k=>h.includes(k)));
    const iMat=col('matr'),iNome=col('nome'),iCPF=col('cpf'),iCargo=col('cargo');
    const iDepto=col('depart','depto'),iStat=col('status'),iMob=col('mobil');
    const iVR=col('vr'),iCafe=col('café','cafe'),iComb=col('comb','combusti');
    const novos=[],duplic=[];
    for(let i=hi+1;i<data.length;i++){
      const r=data[i]; if(!r||!r[iNome]||!String(r[iNome]).trim()) continue;
      const mat=String(r[iMat]||'').trim();
      const nome=String(r[iNome]||'').trim().toUpperCase();
      const existe=colaboradores.some(c=>c.mat===mat||(c.nome.toUpperCase()===nome));
      const c={mat,nome,cpf:String(r[iCPF]||'').trim(),
        cargo:String(r[iCargo]||'').trim().toUpperCase(),depto:String(r[iDepto]||'').trim(),
        status:String(r[iStat]||'Ativo').trim(),
        vr:fnum(r[iVR]),cafe:fnum(r[iCafe]),comb:fnum(r[iComb]),
        mobilidade:String(r[iMob]||'perto').trim().toLowerCase(),
        elegibilidade:{vr:fnum(r[iVR])>0,cafe:fnum(r[iCafe])>0,mobilidade:fnum(r[iComb])>0,folha:true}};
      if(existe) duplic.push(c); else novos.push(c);
    }
    const prev=document.getElementById('carga-preview');
    if(duplic.length>0){
      cargaPendente=novos;
      prev.innerHTML=`
        <div class="alert alert-warning">
          ⚠️ <strong>${duplic.length} duplicatas</strong> encontradas e <strong>${novos.length} novos</strong> colaboradores.
        </div>
        <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px">
          ${duplic.map(c=>`<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:13px">
            <strong>${c.nome}</strong> — Mat: ${c.mat||'—'} — CPF: ${c.cpf||'—'}
          </div>`).join('')}
        </div>
        <div class="btn-row" style="margin-top:0">
          <button class="btn btn-ghost" onclick="document.getElementById('carga-preview').innerHTML=''">Cancelar</button>
          <button class="btn btn-warning" onclick="importarSemDuplic()">⏩ Ignorar duplicatas e importar ${novos.length} novos</button>
        </div>`;
    } else {
      cargaPendente=novos;
      importarSemDuplic();
    }
    event.target.value='';
  };
  reader.readAsBinaryString(file);
}

async function importarSemDuplic(){
  if(cargaPendente.length===0){toast('Nenhum novo colaborador.','warning');return;}
  const b=window._writeBatch(window._db); let n=0;
  cargaPendente.forEach(c=>{
    const id=c.mat||(c.nome.replace(/[^A-Za-z0-9]/g,'_').substr(0,20)+'_'+Date.now()+n);
    c._id=id; b.set(window._doc('colaboradores',id),c); colaboradores.push(c); n++;
  });
  await b.commit(); cargaPendente=[];
  document.getElementById('carga-preview').innerHTML=`<div class="alert alert-success">✅ <strong>${n} colaboradores importados!</strong></div>`;
  toast('✅ '+n+' importados!','success');
}

function gerarModeloCarga(){
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([
    ['Matrícula','Nome','CPF','Cargo','Departamento','Status','VR/dia','Café/dia','Combustível','Mobilidade'],
    ['10001234','EXEMPLO DA SILVA','123.456.789-00','MOTORISTA','Motoristas','Ativo',0,0,295,'combustivel'],
    ['10001235','OUTRO EXEMPLO','234.567.890-11','AJUDANTE','Produção','Ativo',35,15,0,'vt'],
  ]);
  XLSX.utils.book_append_sheet(wb,ws,'Modelo');
  XLSX.writeFile(wb,'Modelo_Carga_Colaboradores.xlsx');
  toast('✅ Modelo baixado!','success');
}

// CÁLCULO DE BENEFÍCIOS
// ════════════════════════════════════════════════════════════════
function getCfg(){
  return {
    vr:  document.querySelector('input[name="cfg-vr"]:checked')?.value||'mult',
    cafe:document.querySelector('input[name="cfg-cafe"]:checked')?.value||'fixo',
    comb:document.querySelector('input[name="cfg-comb"]:checked')?.value||'prop',
    vt:  document.querySelector('input[name="cfg-vt"]:checked')?.value||'mult',
  };
}

function calcBen(c, dr, du){
  if(c.status==='Inativo') return {vr:0,cafe:0,comb:0,vt:0};
  const cfg=getCfg();
  const eleg=c.elegibilidade||{};
  const mob=inferMob(c);
  const vr  = (eleg.vr!==false&&fnum(c.vr)>0)  ? (cfg.vr==='mult'?fnum(c.vr)*dr:fnum(c.vr))   : 0;
  const cafe = (eleg.cafe!==false&&fnum(c.cafe)>0)? (cfg.cafe==='mult'?fnum(c.cafe)*dr:fnum(c.cafe)) : 0;
  let comb=0;
  if(eleg.mobilidade!==false&&mob==='combustivel'&&fnum(c.comb)>0){
    if(cfg.comb==='fixo') comb=fnum(c.comb);
    else comb=calcMob(fnum(c.comb),dr,du);
  }
  const vt=(eleg.mobilidade!==false&&mob==='vt')
    ? (cfg.vt==='mult'?calcVT(c,dr):calcVT(c,1)) : 0;
  return {vr,cafe,comb,vt};
}

function calcMob(val,dr,du){
  if(dr>=du) return val;
  const raw=(val/30)*dr;
  const fl=Math.floor(raw);
  return (raw-fl)<=0.5?fl:fl+1;
}

function calcVT(c,dr){ return [1,2,3,4].reduce((s,n)=>s+fnum(c['vt'+n])*fnum(c['v'+n]),0)*dr; }

function getLanDU(mat, defaultDU){
  const l=lancamento[mat]||{};
  return l.duteis!==undefined?fnum(l.duteis):defaultDU;
}
function getLanDR(mat, defaultDU){
  const l=lancamento[mat]||{};
  const du=l.duteis!==undefined?fnum(l.duteis):defaultDU;
  return Math.max(0,du-fnum(l.faltas)-fnum(l.ferias)+fnum(l.extras));
}

function getLanAtivos(){
  const du=fnum(g('lan-du'))||22;
  const q=(g('lan-q')||'').toLowerCase();
  const empF=g('lan-emp'),depF=g('lan-dep'),benF=g('lan-ben');
  let f=colaboradores.filter(c=>c.status!=='Inativo');
  if(empF) f=f.filter(c=>String(c.mat||'').startsWith(empF));
  if(q) f=f.filter(c=>c.nome.toLowerCase().includes(q)||(c.mat||'').toLowerCase().includes(q));
  if(depF) f=f.filter(c=>(c.depto||'')===depF);
  if(benF==='vr') f=f.filter(c=>fnum(c.vr)>0&&c.elegibilidade?.vr!==false);
  if(benF==='cafe') f=f.filter(c=>fnum(c.cafe)>0&&c.elegibilidade?.cafe!==false);
  if(benF==='comb') f=f.filter(c=>fnum(c.comb)>0&&inferMob(c)==='combustivel');
  if(benF==='vt') f=f.filter(c=>inferMob(c)==='vt'&&[1,2,3,4].some(n=>fnum(c['vt'+n])>0));
  return f;
}

function renderLancamento(){
  const du=fnum(g('lan-du'))||22;
  const ativos=getLanAtivos();
  let tVR=0,tCafe=0,tComb=0,tVT=0;
  ativos.forEach(c=>{
    const dr=getLanDR(c.mat,du);
    const {vr,cafe,comb,vt}=calcBen(c,dr,getLanDU(c.mat,du));
    tVR+=vr;tCafe+=cafe;tComb+=comb;tVT+=vt;
  });
  // Atualizar rodapé
  const tfoot=document.getElementById('lan-tfoot');
  if(tfoot){
    tfoot.style.display=ativos.length>0?'table-footer-group':'none';
    const empF=g('lan-emp');
    const totalAtivos=colaboradores.filter(c=>c.status!=='Inativo').length;
    document.getElementById('lan-tot-label').textContent=
      empF?`Empresa ${empF} — ${ativos.length} colaboradores`
      :ativos.length===totalAtivos?'Totais do mês':`Seleção (${ativos.length})`;
    document.getElementById('lan-tot-colab').textContent=`${ativos.length} colaborador${ativos.length!==1?'es':''}`;
    document.getElementById('lan-tot-vr').textContent=tVR>0?brl(tVR):'—';
    document.getElementById('lan-tot-cafe').textContent=tCafe>0?brl(tCafe):'—';
    document.getElementById('lan-tot-comb').textContent=tComb>0?brl(tComb):'—';
    document.getElementById('lan-tot-vt').textContent=tVT>0?brl(tVT):'—';
    document.getElementById('lan-tot-geral').textContent=brl(tVR+tCafe+tComb+tVT);
  }
  // Atualizar resumo card
  const resumo=document.getElementById('lan-resumo-vals');
  if(resumo) resumo.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px">
      <div>🍽️ VR: <strong>${brl(tVR)}</strong></div>
      <div>☕ Café: <strong>${brl(tCafe)}</strong></div>
      <div>⛽ Comb.: <strong>${brl(tComb)}</strong></div>
      <div>🚌 VT: <strong>${brl(tVT)}</strong></div>
      <div style="grid-column:1/-1;padding-top:4px;border-top:1px solid var(--border)">
        💰 Total: <strong style="color:var(--green);font-size:14px">${brl(tVR+tCafe+tComb+tVT)}</strong>
      </div>
    </div>`;

  const tbody=document.getElementById('lan-tbody'); if(!tbody) return;
  if(ativos.length===0){
    tbody.innerHTML=`<tr><td colspan="13"><div class="empty-state"><div class="empty-icon">📅</div><p>Nenhum resultado.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML=ativos.map((c,i)=>{
    const l=lancamento[c.mat]||{};
    const locked=l.locked||false;
    const du2=l.duteis!==undefined?fnum(l.duteis):du;
    const fat=fnum(l.faltas),fev=fnum(l.ferias),ext=fnum(l.extras);
    const dr=Math.max(0,du2-fat-fev+ext);
    const {vr,cafe,comb,vt}=calcBen(c,dr,du2);
    const total=vr+cafe+comb+vt;
    const dis=locked?'disabled':'' ;
    return `<tr>
      <td><code style="font-size:10px">${c.mat||'—'}</code></td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;font-size:12px" title="${c.nome}">${c.nome}</td>
      <td style="text-align:center"><input type="checkbox" ${locked?'checked':''} title="${locked?'Desbloquear':'Travar'}" onchange="toggleLock('${c.mat}',this.checked)" style="cursor:pointer;accent-color:var(--yellow)"></td>
      <td><input type="number" value="${du2}" min="0" max="31" class="input-du ${locked?'cell-locked':''}" ${dis} onchange="setLan('${c.mat}','duteis',this.value)"></td>
      <td><input type="number" value="${fat}" min="0" max="31" class="input-falta" onchange="setLan('${c.mat}','faltas',this.value)"></td>
      <td><input type="number" value="${fev}" min="0" max="31" class="input-ferias" onchange="setLan('${c.mat}','ferias',this.value)"></td>
      <td><input type="number" value="${ext}" min="0" max="31" class="input-extras" onchange="setLan('${c.mat}','extras',this.value)" title="Dias extras"></td>
      <td class="dias-reais">${dr}</td>
      <td class="total-cell">${vr>0?brl(vr):'—'}</td>
      <td class="total-cell">${cafe>0?brl(cafe):'—'}</td>
      <td class="total-cell">${comb>0?brl(comb):'—'}</td>
      <td class="total-cell">${vt>0?brl(vt):'—'}</td>
      <td class="total-cell" style="color:var(--blue);font-weight:700">${brl(total)}</td>
    </tr>`;
  }).join('');
}

async function toggleLock(mat,locked){
  if(!lancamento[mat]) lancamento[mat]={};
  lancamento[mat].locked=locked;
  try{ await fsSetLan(mat,lancamento[mat]); }catch(e){}
  renderLancamento();
}

async function setLan(mat,campo,val){
  if(!lancamento[mat]) lancamento[mat]={};
  lancamento[mat][campo]=fnum(val);
  try{ await fsSetLan(mat,lancamento[mat]); }catch(e){}
  renderLancamento();
}

async function aplicarDiasUteis(){
  const du=fnum(g('lan-du'));
  const b=window._writeBatch(window._db);
  let travados=0;
  colaboradores.forEach(c=>{
    if(lancamento[c.mat]?.locked){travados++;return;}
    if(!lancamento[c.mat]) lancamento[c.mat]={};
    lancamento[c.mat].duteis=du;
    b.set(window._doc('lancamento',c.mat),lancamento[c.mat]);
  });
  await b.commit();
  renderLancamento();
  toast(`✅ Dias (${du}) aplicados.`+(travados?` ${travados} travados mantidos.`:''),'success');
}

async function fecharCompetencia(){
  const comp=g('lan-comp');
  if(!comp){toast('Informe a competência (MM/AAAA)','error');return;}
  if(!confirm(`Fechar competência ${comp}? Isso salva um snapshot dos dados atuais.`)) return;
  const du=fnum(g('lan-du'))||22;
  const ativos=colaboradores.filter(c=>c.status!=='Inativo');
  let tVR=0,tCafe=0,tComb=0,tVT=0;
  const detalhes=ativos.map(c=>{
    const du2=getLanDU(c.mat,du);
    const dr=getLanDR(c.mat,du);
    const {vr,cafe,comb,vt}=calcBen(c,dr,du2);
    tVR+=vr;tCafe+=cafe;tComb+=comb;tVT+=vt;
    return {mat:c.mat,nome:c.nome,cpf:c.cpf||'',depto:c.depto||'',
      du:du2,faltas:fnum(lancamento[c.mat]?.faltas),ferias:fnum(lancamento[c.mat]?.ferias),
      extras:fnum(lancamento[c.mat]?.extras),dr,vr,cafe,comb,vt,total:vr+cafe+comb+vt};
  });
  try{
    await fsSet('historico',comp.replace('/','_'),{
      competencia:comp,fechadoEm:new Date().toISOString(),totalColaboradores:ativos.length,
      totais:{vr:tVR,cafe:tCafe,comb:tComb,vt:tVT,geral:tVR+tCafe+tComb+tVT},detalhes
    });
    toast(`✅ Competência ${comp} fechada!`,'success');
  }catch(e){toast('Erro: '+e.message,'error');}
}

async function importarFaltas(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let hi=-1;
    for(let i=0;i<Math.min(6,data.length);i++){if(data[i].some(v=>String(v||'').toLowerCase().includes('falta'))){hi=i;break;}}
    if(hi<0){toast('Coluna "Faltas" não encontrada','error');return;}
    const hs=data[hi].map(h=>String(h||'').toLowerCase());
    const iMat=hs.findIndex(h=>h.includes('matr')),iFal=hs.findIndex(h=>h.includes('falta'));
    const b=window._writeBatch(window._db); let ok=0;
    for(let i=hi+1;i<data.length;i++){
      const row=data[i]; if(!row||row.every(v=>!v)) continue;
      const mat=String(row[iMat]||'').trim(); if(!mat) continue;
      if(colaboradores.find(c=>c.mat===mat)){
        if(!lancamento[mat]) lancamento[mat]={};
        lancamento[mat].faltas=fnum(row[iFal]);
        b.set(window._doc('lancamento',mat),lancamento[mat]); ok++;
      }
    }
    await b.commit();
    document.getElementById('faltas-preview').innerHTML=
      `<div class="alert alert-success">✅ <strong>${ok} colaboradores</strong> atualizados.</div>`;
    toast(`✅ ${ok} faltas atualizadas`,'success');
    event.target.value='';
  };
  reader.readAsBinaryString(file);
}

function gerarModeloFaltas(){
  const wb=XLSX.utils.book_new();
  const rows=[['Matrícula','Nome Completo','CPF','Nº de Faltas'],
    ...colaboradores.filter(c=>c.status!=='Inativo').map(c=>[c.mat||'',c.nome,c.cpf||'',0])];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,'Faltas');
  XLSX.writeFile(wb,'Modelo_Faltas.xlsx');
  toast('✅ Modelo baixado!','success');
}

function fmtValCaju(v){ return (parseFloat(v)||0).toFixed(2); }

function getCajuAtivos(empSel){
  let f=colaboradores.filter(c=>c.status!=='Inativo');
  if(empSel) f=f.filter(c=>String(c.mat||'').startsWith(empSel));
  return f;
}

function exportarCajuCompleto(){
  const comp=g('lan-comp')||'MES';
  const empSel=g('exp-emp');
  const du=fnum(g('lan-du'))||22;
  const header=['CPF','Matricula (opcional)','Valor Fixo em Auxilio Alimentacao','Mobilidade','Valor Fixo em Mobilidade','Cultura','Valor Fixo em Cultura','Saude','Valor Fixo em Saude','Educacao','Valor Fixo em Educacao','Home Office','Valor Fixo em Home Office'].join(SEP);
  const linhas=[header];
  getCajuAtivos(empSel).forEach(c=>{
    const dr=getLanDR(c.mat,du);
    const {vr,cafe,comb,vt}=calcBen(c,dr,getLanDU(c.mat,du));
    const alim=vr+cafe, mob=comb+vt;
    if(alim===0&&mob===0) return;
    const cpf=(c.cpf||'').replace(/[^0-9]/g,'').padStart(11,'0');
    linhas.push([cpf,c.mat||'',fmtValCaju(alim),'0',fmtValCaju(mob),'0','0','0','0','0','0','0','0'].join(SEP));
  });
  const blob=new Blob([linhas.join(NL)],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='pedidos_caju_'+comp.replace('/','_')+(empSel?'_'+empSel:'')+'.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('✅ Arquivo Caju exportado!','success');
}

function exportarCajuTipo(tipo){
  const comp=g('lan-comp')||'MES';
  const empSel=g('exp-emp');
  const du=fnum(g('lan-du'))||22;
  const nomes={vr:'VR',cafe:'Cafe',comb:'Mobilidade'};
  const rows=[['CPF','Matrícula','Valor']];
  getCajuAtivos(empSel).forEach(c=>{
    const dr=getLanDR(c.mat,du);
    const {vr,cafe,comb}=calcBen(c,dr,getLanDU(c.mat,du));
    const val=tipo==='vr'?vr:tipo==='cafe'?cafe:comb;
    if(val>0) rows.push([c.cpf||'',c.mat||'',val]);
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),nomes[tipo]);
  XLSX.writeFile(wb,nomes[tipo]+'_'+comp.replace('/','_')+(empSel?'_'+empSel:'')+'.xlsx');
  toast('✅ Exportado!','success');
}

  const header=['CPF','Matricula (opcional)','Valor Fixo em Auxilio Alimentacao','Mobilidade','Valor Fixo em Mobilidade','Cultura','Valor Fixo em Cultura','Saude','Valor Fixo em Saude','Educacao','Valor Fixo em Educacao','Home Office','Valor Fixo em Home Office'].join(SEP);
  const empresas=getEmpresaList();
  empresas.forEach((emp,i)=>{
    setTimeout(()=>{
      const linhas=[header];
      colaboradores.filter(c=>c.status!=='Inativo'&&String(c.mat||'').startsWith(emp.cod)).forEach(c=>{
        const dr=getLanDR(c.mat,du);
        const {vr,cafe,comb,vt}=calcBen(c,dr,getLanDU(c.mat,du));
        const alim=vr+cafe,mob=comb+vt;
        if(alim===0&&mob===0) return;
        const cpf=(c.cpf||'').replace(/[^0-9]/g,'').padStart(11,'0');
        linhas.push([cpf,c.mat||'',fmtValCaju(alim),'0',fmtValCaju(mob),'0','0','0','0','0','0','0','0'].join(SEP));
      });
      const blob=new Blob([linhas.join(NL)],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='pedidos_caju_'+emp.cod+'_'+comp.replace('/','_')+'.csv';
      a.click(); URL.revokeObjectURL(url);
    },i*500);
  });
  setTimeout(()=>toast('✅ '+empresas.length+' CSVs Caju gerados!','success'),empresas.length*500+300);
}

function exportarSenior(tipo){
  const comp=g('lan-comp')||'MES';
  const empSel=document.getElementById('exp-senior-emp')?.value||'';
  const du=fnum(g('lan-du'))||22;
  const nomes={vr:'VR',cafe:'Cafe_Manha',comb:'Mobilidade',vt:'VT'};
  const linhas=['CPF,Empresa,Valor'];
  let f=colaboradores.filter(c=>c.status!=='Inativo');
  if(empSel) f=f.filter(c=>String(c.mat||'').startsWith(empSel));
  f.forEach(c=>{
    const dr=getLanDR(c.mat,du);
    const {vr,cafe,comb,vt}=calcBen(c,dr,getLanDU(c.mat,du));
    const val=tipo==='vr'?vr:tipo==='cafe'?cafe:tipo==='comb'?comb:vt;
    if(val>0){
      const cpf=(c.cpf||'').replace(/[^0-9]/g,'').padStart(11,'0');
      const emp=String(c.mat||'').substring(0,4)||'0000';
      linhas.push(cpf+','+emp+','+val.toFixed(2).replace('.',','));
    }
  });
  const blob=new Blob([linhas.join(NL)],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=nomes[tipo]+'_Senior_'+comp.replace('/','_')+'.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('✅ '+nomes[tipo]+' Senior exportado!','success');
}

async function importarBase(event){
  const file=event.target.files[0]; if(!file) return;
  if(!confirm('Vai ADICIONAR colaboradores novos sem apagar os existentes. Continuar?')) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let hi=0;
    for(let i=0;i<Math.min(5,data.length);i++){if(data[i].some(v=>String(v||'').toLowerCase().includes('nome'))){hi=i;break;}}
    const hs=data[hi].map(h=>String(h||'').toLowerCase().trim());
    const col=(...keys)=>hs.findIndex(h=>keys.some(k=>h.includes(k)));
    const iMat=col('matr'),iNome=col('nome'),iCPF=col('cpf'),iCargo=col('cargo');
    const iDepto=col('depart','depto'),iStat=col('status'),iMob=col('mobil');
    const iVR=col('vr/d','vr_d','vr dia','vr'),iCafe=col('café','cafe');
    const iComb=col('comb','combusti');
    const b=window._writeBatch(window._db); let novos=0,ign=0;
    for(let i=hi+1;i<data.length;i++){
      const r=data[i]; if(!r||!r[iNome]||!String(r[iNome]).trim()) continue;
      const mat=String(r[iMat]||'').trim();
      if(mat&&colaboradores.some(c=>c.mat===mat)){ign++;continue;}
      const c={mat,nome:String(r[iNome]).trim().toUpperCase(),cpf:String(r[iCPF]||'').trim(),
        cargo:String(r[iCargo]||'').trim().toUpperCase(),depto:String(r[iDepto]||'').trim(),
        status:String(r[iStat]||'Ativo').trim(),mobilidade:String(r[iMob]||'perto').trim().toLowerCase(),
        vr:fnum(r[iVR]),cafe:fnum(r[iCafe]),comb:fnum(r[iComb]),
        elegibilidade:{vr:fnum(r[iVR])>0,cafe:fnum(r[iCafe])>0,mobilidade:fnum(r[iComb])>0,folha:true}};
      const id=mat||(c.nome.replace(/[^A-Za-z0-9]/g,'_').substr(0,20)+'_'+Date.now()+novos);
      c._id=id; b.set(window._doc('colaboradores',id),c); colaboradores.push(c); novos++;
    }
    await b.commit();
    toast('✅ '+novos+' importados, '+ign+' ignorados.','success');
    event.target.value='';
  };
  reader.readAsBinaryString(file);
}

function processarFolha(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let hi=0;
    for(let i=0;i<Math.min(5,data.length);i++){
      if(data[i].some(v=>String(v||'').toLowerCase().includes('cadastro')||String(v||'').toLowerCase().includes('evento'))){hi=i;break;}
    }
    const hs=data[hi].map(h=>String(h||'').toLowerCase().trim());
    const iMat=hs.findIndex(h=>h.includes('cadastro')||h.includes('matr'));
    const iNome=hs.findIndex(h=>h.includes('nome'));
    const iEv=hs.findIndex(h=>h==='evento'||(h.includes('evento')&&!h.includes('descri')));
    const iValor=hs.findIndex(h=>h.includes('valor'));
    const porColab={};
    for(let i=hi+1;i<data.length;i++){
      const r=data[i]; if(!r||!r[iMat]) continue;
      const mat=String(r[iMat]||'').trim();
      const nome=String(r[iNome]||'').trim().toUpperCase();
      const ev=String(r[iEv]||'').trim();
      const val=fnum(r[iValor]);
      if(!porColab[mat]) porColab[mat]={mat,nome,eventos:{}};
      if(ev) porColab[mat].eventos[ev]=(porColab[mat].eventos[ev]||0)+val;
    }
    const du=fnum(g('lan-du'))||22;
    Object.keys(porColab).forEach(mat=>{
      const c=colaboradores.find(x=>x.mat===mat);
      if(c){
        porColab[mat].depto=c.depto||''; porColab[mat].cargo=c.cargo||''; porColab[mat].cpf=c.cpf||'';
        const dr=getLanDR(mat,du);
        const {vr,cafe,comb,vt}=calcBen(c,dr,getLanDU(mat,du));
        porColab[mat].ben={vr,cafe,comb,vt};
      }
    });
    folhaData=Object.values(porColab);
    const prev=document.getElementById('folha-import-preview');
    if(prev) prev.innerHTML=`<div class="alert alert-success">
      ✅ <strong>${folhaData.length} colaboradores</strong> processados.
      <button class="btn btn-primary btn-sm" onclick="switchModule('folha');showPage('folha-view')" style="margin-left:10px">Ver Folha →</button>
    </div>`;
    toast('✅ Folha processada: '+folhaData.length+' colaboradores','success');
    event.target.value='';
  };
  reader.readAsBinaryString(file);
}

function renderFolhaView(){
  if(!folhaData||folhaData.length===0) return;
  const todosEv=[...new Set(folhaData.flatMap(d=>Object.keys(d.eventos||{})))].sort((a,b)=>parseInt(a)-parseInt(b));
  const sub=document.getElementById('folha-sub');
  if(sub) sub.textContent=`${folhaData.length} colaboradores · ${todosEv.length} tipos de eventos`;
  const cont=document.getElementById('folha-content');
  if(!cont) return;

function filtrarFolha(){
  const q=(document.getElementById('folha-q')?.value||'').toLowerCase();
  const rows=document.querySelectorAll('#folha-tbody tr');
  let vis=0;
  rows.forEach(row=>{
    const show=row.textContent.toLowerCase().includes(q);
    row.style.display=show?'':'none';
    if(show)vis++;
  });
  const cnt=document.getElementById('folha-count');
  if(cnt) cnt.textContent=vis+' colaboradores';
}

function exportarFolhaExcel(){
  if(!folhaData||folhaData.length===0){toast('Nenhuma folha','error');return;}
  const todosEv=[...new Set(folhaData.flatMap(d=>Object.keys(d.eventos||{})))].sort((a,b)=>parseInt(a)-parseInt(b));
  const header=['Matrícula','Nome','CPF','Departamento',...todosEv.map(ev=>EVENTOS_MAP[ev]||('Evento '+ev)),'VR','Café','Combustível','VT','Total Benefícios'];
  const rows=[header,...folhaData.map(d=>{
    const row=[d.mat,d.nome,d.cpf||'',d.depto||''];
    todosEv.forEach(ev=>row.push(d.eventos[ev]||''));
    const b=d.ben||{};
    row.push(b.vr||'',b.cafe||'',b.comb||'',b.vt||'',((b.vr||0)+(b.cafe||0)+(b.comb||0)+(b.vt||0))||'');
    return row;
  })];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Folha por Equipes');
  XLSX.writeFile(wb,'Folha_'+new Date().toLocaleDateString('pt-BR').replace(/\//g,'_')+'.xlsx');
  toast('✅ Folha exportada!','success');
}

function renderFerRadar(){
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const empF=document.getElementById('fer-emp')?.value||'';
  const depF=document.getElementById('fer-dep')?.value||'';
  let f=colaboradores.filter(c=>c.status!=='Inativo');
  if(empF) f=f.filter(c=>String(c.mat||'').startsWith(empF));
  if(depF) f=f.filter(c=>(c.depto||'')===depF);

  function getDotClass(c){
    if(!c.ferVenc) return null;
    const venc=new Date(c.ferVenc);
    const meses=(hoje-venc)/(1000*60*60*24*30);
    if(meses<0) return {cls:'dot-green',label:'OK',meses:Math.abs(Math.round(meses))};
    if(meses<=10) return {cls:'dot-yellow',label:Math.round(meses)+'m venc.',meses:Math.round(meses)};
    if(meses<=12) return {cls:'dot-orange',label:Math.round(meses)+'m venc.',meses:Math.round(meses)};
    return {cls:'dot-red',label:Math.round(meses)+'m venc.',meses:Math.round(meses)};
  }

  const comFerias=f.filter(c=>c.ferVenc);
  const semFerias=f.filter(c=>!c.ferVenc);
  const stats={verde:0,amarelo:0,laranja:0,vermelho:0};
  comFerias.forEach(c=>{
    const d=getDotClass(c);
    if(d?.cls==='dot-green')stats.verde++;
    else if(d?.cls==='dot-yellow')stats.amarelo++;
    else if(d?.cls==='dot-orange')stats.laranja++;
    else if(d?.cls==='dot-red')stats.vermelho++;
  });

  const statsEl=document.getElementById('fer-stats');
  if(statsEl) statsEl.innerHTML=`
    <div class="stats-grid" style="margin-bottom:0">
      <div class="stat-card green"><div class="stat-val" style="color:var(--green)">${stats.verde}</div><div class="stat-label">✅ Férias OK</div></div>
      <div class="stat-card yellow"><div class="stat-val" style="color:var(--yellow)">${stats.amarelo}</div><div class="stat-label">⚠️ Vencida 1-10m</div></div>
      <div class="stat-card orange"><div class="stat-val" style="color:var(--orange)">${stats.laranja}</div><div class="stat-label">🟠 Vencida 11-12m</div></div>
      <div class="stat-card red"><div class="stat-val" style="color:var(--red)">${stats.vermelho}</div><div class="stat-label">🔴 Vencida +12m</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--text2)">${semFerias.length}</div><div class="stat-label">Sem dados de férias</div></div>
    </div>`;

  const grid=document.getElementById('fer-radar-grid');
  if(grid){
    const comDados=comFerias.sort((a,b)=>{
      const da=getDotClass(a),db=getDotClass(b);
      const order={null:-1,'dot-green':0,'dot-yellow':1,'dot-orange':2,'dot-red':3};
      return (order[db?.cls]||0)-(order[da?.cls]||0);
    });
    grid.innerHTML=`
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">
        ${comDados.length} colaboradores com dados de férias
      </div>
      <div class="radar-container">
        ${comDados.map(c=>{
          const d=getDotClass(c);
          if(!d) return '';
          const diasDisp=c.ferDias||30;
          return `<div class="radar-item" title="${c.nome} — Venc: ${c.ferVenc||'—'}">
            <div class="radar-dot ${d.cls}">${d.meses}m</div>
            <div class="radar-name">${c.nome.split(' ')[0]} ${c.nome.split(' ').slice(-1)[0]}</div>
            <div class="radar-venc">Venc: ${c.ferVenc||'—'}</div>
            <div class="radar-dias" style="color:${d.cls==='dot-green'?'var(--green)':d.cls==='dot-yellow'?'var(--yellow)':d.cls==='dot-orange'?'var(--orange)':'var(--red)'}">
              ${diasDisp} dias
            </div>
          </div>`;
        }).join('')}
      </div>`;
  }

  // Tabela
  const tbl=document.getElementById('fer-tabela');
  if(tbl) tbl.innerHTML=`
    <div class="card-title" style="margin-bottom:10px">📋 Tabela Detalhada</div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Status</th><th>Matrícula</th><th>Nome</th><th>Departamento</th>
          <th>Em Férias</th><th>Início</th><th>Fim</th><th>Vencimento</th><th>Dias Disp.</th>
        </tr></thead>
        <tbody>
          ${f.map((c,i)=>{
            const d=getDotClass(c);
            const dot=d?`<div class="radar-dot ${d.cls}" style="width:24px;height:24px;font-size:9px;margin:0">${d.meses}m</div>`:'<div style="width:24px;height:24px;border-radius:50%;background:var(--border);margin:0"></div>';
            return `<tr>
              <td>${dot}</td>
              <td><code style="font-size:10px">${c.mat||'—'}</code></td>
              <td style="font-size:12px;font-weight:500">${c.nome}</td>

}

async function importarFeriasData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let hi=0;
    for(let i=0;i<Math.min(5,data.length);i++){if(data[i].some(v=>String(v||'').toLowerCase().includes('nome'))){hi=i;break;}}
    const hs=data[hi].map(h=>String(h||'').toLowerCase().trim());
    const iMat=hs.findIndex(h=>h.includes('matr')||h.includes('cadastro'));
    const iIni=hs.findIndex(h=>h.includes('inicio')||h.includes('início')||h.includes('ini'));
    const iFim=hs.findIndex(h=>h.includes('fim')||h.includes('retorno'));
    const iVenc=hs.findIndex(h=>h.includes('venc'));
    const iDias=hs.findIndex(h=>h.includes('dias'));
    const b=window._writeBatch(window._db); let ok=0;
    for(let i=hi+1;i<data.length;i++){
      const r=data[i]; if(!r||!r[iMat]) continue;
      const mat=String(r[iMat]||'').trim();
      const c=colaboradores.find(x=>x.mat===mat); if(!c) continue;
      try{
        if(r[iIni]) c.ferInicio=new Date(r[iIni]).toISOString().split('T')[0];
        if(r[iFim])  c.ferFim   =new Date(r[iFim]).toISOString().split('T')[0];
        if(r[iVenc]) c.ferVenc  =new Date(r[iVenc]).toISOString().split('T')[0];
        if(r[iDias]) c.ferDias  =fnum(r[iDias]);
        b.set(window._doc('colaboradores',c._id),c); ok++;
      }catch(err){}
    }
    await b.commit();
    document.getElementById('fer-import-prev').innerHTML=
      `<div class="alert alert-success">✅ <strong>${ok} colaboradores</strong> atualizados com dados de férias.</div>`;
    toast('✅ Férias importadas: '+ok,'success');
    event.target.value='';
  };
  reader.readAsBinaryString(file);
}

function exportarFeriasExcel(){
  const wb=XLSX.utils.book_new();
  const rows=[['Matrícula','Nome','CPF','Departamento','Status','Início Férias','Fim Férias','Vencimento','Dias Disponíveis'],
    ...colaboradores.map(c=>[c.mat||'',c.nome,c.cpf||'',c.depto||'',c.status,c.ferInicio||'',c.ferFim||'',c.ferVenc||'',c.ferDias||''])];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:35},{wch:16},{wch:20},{wch:10},{wch:14},{wch:14},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,'Férias');
  XLSX.writeFile(wb,'Controle_Ferias.xlsx');
  toast('✅ Excel exportado!','success');
}

function initApp(user){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  document.getElementById('user-name').textContent=user.email;
  Promise.all([loadColaboradores(),loadLancamento(),loadConfig()]).then(()=>{
    switchModule('base');
    setTimeout(()=>{
      const el=document.getElementById('lan-comp');
      if(el&&!el.value){
        const hoje=new Date();
        el.value=String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear();
      }
    },500);
  });
}

function waitFirebase(cb){ if(window._firebaseReady)cb(); else window.addEventListener('firebaseReady',cb,{once:true}); }

waitFirebase(()=>{
  window._onAuthStateChanged(window._auth, user=>{
    if(user) initApp(user);
    else {
      document.getElementById('login-screen').style.display='flex';
      document.getElementById('app-screen').style.display='none';
    }
  });
});

</script>
