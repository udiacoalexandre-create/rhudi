<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --brand:#047857; --surface:#fff; --fundo:#f8fafc;
  --border:#e2e8f0; --texto:#0f172a; --texto2:#475569; --texto3:#94a3b8;
  --cm-alta:#b91c1c; --cm-media:#b45309;
  --cm-briefing:#4f46e5; --cm-fila:#64748b; --cm-andamento:#2563eb;
  --cm-pausada:#7c3aed; --cm-validacao:#b45309; --cm-entregue:#15803d;
}
html,body{margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;
  background:var(--fundo);color:var(--texto)}
.barra{display:flex;align-items:center;gap:12px;padding:11px 20px;
  background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.marca__logo{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.tit{font-weight:600;font-size:14px}
.sub{font-size:11.5px;opacity:.85}
.esp{flex:1}
.selo{font-size:10.5px;background:rgba(255,255,255,.18);padding:3px 9px;
  border-radius:20px;white-space:nowrap}
.conteudo{max-width:1480px;margin:0 auto;padding:16px 20px 40px}

/* indicadores — mesma barra fina da plataforma, sem os botões de filtro */
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px;
  padding:7px 11px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.stat1{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.stat1__n{font-size:17px;font-weight:700;line-height:1.1}
.stat1__l{font-size:11.5px;color:var(--texto2)}
.stats__sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
.st-tot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
  color:var(--texto2);white-space:nowrap}
.st-tot__n{display:inline-flex;align-items:center;justify-content:center;
  min-width:19px;height:19px;padding:0 5px;border-radius:6px;
  font-size:11px;font-weight:700;color:#fff;background:var(--c)}

/* sprints */
.sp-bloco{margin-bottom:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden}
.sp-bloco--atual{border-color:#a7f3d0;box-shadow:0 1px 3px rgba(4,120,87,.09)}
.sp-cab{display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;
  background:#f1f5f9;border-left:3px solid var(--texto3);user-select:none}
.sp-cab--atual{background:#ecfdf5;border-left-color:var(--brand)}
.sp-cab--futura{border-left-color:var(--cm-andamento)}
.sp-cab--passada{background:#f8fafc}
.sp-cab:hover{filter:brightness(.98)}
.sp-seta{font-size:13px;color:var(--texto2);width:13px;text-align:center}
.sp-tit{font-weight:700;font-size:13px}
.sp-selo{font-size:10px;padding:2px 7px;border-radius:20px;background:#e2e8f0;
  color:var(--texto2);white-space:nowrap}
.sp-selo--atual{background:var(--brand);color:#fff}
.sp-selo--enc{background:#e2e8f0;color:var(--texto3)}
.sp-selo--sem{background:#fef3c7;color:#92400e}
.sp-n{font-size:11px;color:var(--texto2);white-space:nowrap}

/* tabela — mesmas larguras da plataforma, menos a coluna Editar */
.tbl-wrap{overflow-x:auto}
table.dm{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;min-width:790px}
table.dm th{padding:6px 9px;text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--texto2);background:#f8fafc;
  border-bottom:1px solid var(--border);white-space:nowrap}
table.dm td{padding:6px 9px;border-bottom:1px solid #f1f5f9;vertical-align:middle;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.dm tr:last-child td{border-bottom:none}
.dm-tit{font-weight:600}
.tem-desc{border-bottom:1px dotted var(--texto3);cursor:help}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;
  font-weight:600;color:#fff;white-space:nowrap}
.prio{display:inline-flex;align-items:center;justify-content:center;min-width:22px;
  height:20px;padding:0 5px;border-radius:6px;background:#f1f5f9;
  font-size:11.5px;font-weight:700;color:var(--texto2)}
.suave{color:var(--texto2)}
.prazo-venc{color:var(--cm-alta);font-weight:700}
.prazo-perto{color:var(--cm-media);font-weight:700}
.dt-obs{font-size:10px;color:var(--texto3);margin-top:1px}
.centrado{text-align:center}

/* sprints encerradas fora do caminho */
.enc-tg{display:flex;align-items:center;gap:7px;width:100%;padding:8px 12px;
  background:var(--surface);border:1px dashed var(--border);border-radius:10px;
  font-family:inherit;font-size:12px;color:var(--texto2);cursor:pointer;margin-bottom:10px}
.enc-tg:hover{background:#f8fafc}
.enc-tg__x{margin-left:auto;font-size:11px;color:var(--brand);font-weight:600}

.balao{position:fixed;z-index:60;max-width:440px;padding:9px 12px;background:#0f172a;
  color:#fff;border-radius:9px;font-size:12px;line-height:1.45;white-space:pre-wrap;
  box-shadow:0 8px 22px rgba(0,0,0,.28);pointer-events:none;display:none}
.centro{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:70px 30px;text-align:center}
.centro h1{font-size:17px;margin:0}
.centro p{font-size:13px;color:var(--texto2);margin:0;max-width:430px;line-height:1.55}
.spin{width:26px;height:26px;border:3px solid #d1fae5;border-top-color:var(--brand);
  border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.rodape{font-size:10.5px;color:var(--texto3);text-align:center;padding:14px 20px 24px}
</style>

<div class="barra">
  <div class="marca"><div class="marca__logo">U</div><span>Udiaço</span></div>
  <div>
    <div class="tit" id="p-tit">Demandas de tecnologia</div>
    <div class="sub" id="p-sub"></div>
  </div>
  <span class="esp"></span>
  <span class="selo">Somente leitura</span>
</div>

<div class="conteudo">
  <div class="centro" id="estado">
    <div class="spin"></div>
    <p>Carregando as demandas...</p>
  </div>
  <div id="corpo" style="display:none">
    <div id="stats"></div>
    <div id="lista"></div>
  </div>
</div>
<div class="rodape" id="rodape"></div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function estado(titulo,texto){
  $('corpo').style.display='none';
  const e=$('estado'); e.style.display='flex';
  e.innerHTML='<h1>'+esc(titulo)+'</h1><p>'+esc(texto)+'</p>';
}

// ── Datas ─────────────────────────────────────────────────────────────────
function _dl(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function hoje0(){ const h=new Date(); return new Date(h.getFullYear(),h.getMonth(),h.getDate()); }
const dISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
  +'-'+String(d.getDate()).padStart(2,'0');
function diasAte(iso){ const d=_dl(iso); return d?Math.round((d-hoje0())/86400000):null; }
function soData(iso){ const d=_dl(iso); return d?dISO(d).split('-').reverse().join('/'):'—'; }
function dataHora(iso){
  const d=new Date(iso); if(isNaN(d)) return '—';
  const p=n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()
    +' às '+p(d.getHours())+':'+p(d.getMinutes());
}

// ── Sprints ───────────────────────────────────────────────────────────────
// Mesma janela usada na plataforma (comercial.js). O agrupamento é feito AQUI,
// e não gravado no retrato, para que "sprint atual" seja a de hoje de quem
// está olhando — o retrato só é reescrito quando alguém mexe numa demanda.
let cadencia='quinzenal';
const SPRINT_DIAS={semanal:7, quinzenal:14};
const SEG_REF=new Date(2026,0,5);        // 05/01/2026, uma segunda-feira
function sprintDe(iso){
  const d=_dl(iso); if(!d) return null;
  if(cadencia==='mensal'){
    const ini=new Date(d.getFullYear(),d.getMonth(),1);
    const fim=new Date(d.getFullYear(),d.getMonth()+1,0);
    return {ini,fim,chave:ini.getFullYear()+'-'+String(ini.getMonth()+1).padStart(2,'0')};
  }
  const n=SPRINT_DIAS[cadencia]||14;
  const bloco=Math.floor(Math.round((d-SEG_REF)/86400000)/n);
  const ini=new Date(SEG_REF); ini.setDate(SEG_REF.getDate()+bloco*n);
  const fim=new Date(ini);     fim.setDate(ini.getDate()+n-1);
  return {ini,fim,chave:ini.getFullYear()+'-'+String(ini.getMonth()+1).padStart(2,'0')
    +'-'+String(ini.getDate()).padStart(2,'0')};
}
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function sprintTitulo(sp){
  if(!sp) return 'Sem prazo definido';
  if(cadencia==='mensal') return MES3[sp.ini.getMonth()]+'/'+sp.ini.getFullYear();
  const f=d=>String(d.getDate()).padStart(2,'0')+' '+MES3[d.getMonth()];
  return f(sp.ini)+' a '+f(sp.fim);
}
function prioNum(v){ if(v===''||v==null) return 9999;
  const n=Number(v); return isFinite(n)?n:9999; }

// ── Estado ────────────────────────────────────────────────────────────────
let itens=[], STATUS=[];
let spFechadas=new Set(), verEncerradas=false;
const sInfo=v=>STATUS.find(s=>s.v===v)||{v,l:v||'—',cor:'var(--cm-fila)'};
function alternarSprint(chave){
  if(spFechadas.has(chave)) spFechadas.delete(chave); else spFechadas.add(chave);
  pintar();
}
function alternarEncerradas(){ verEncerradas=!verEncerradas; pintar(); }

// ── Balão do descritivo (mesma leitura da plataforma, sem editar nada) ────
function balao(){
  let b=$('balao');
  if(!b){ b=document.createElement('div'); b.id='balao'; b.className='balao';
    document.body.appendChild(b); }
  return b;
}
function moverBalao(ev){
  const b=balao(), m=14;
  let x=ev.clientX+m, y=ev.clientY+m;
  const r=b.getBoundingClientRect();
  if(x+r.width>innerWidth-8)  x=Math.max(8, ev.clientX-r.width-m);
  if(y+r.height>innerHeight-8) y=Math.max(8, ev.clientY-r.height-m);
  b.style.left=x+'px'; b.style.top=y+'px';
}
// Delegação no documento: o balão precisa funcionar em linhas que a tabela
// redesenha a cada abrir/fechar de sprint.
document.addEventListener('mouseover', ev=>{
  const alvo=ev.target.closest&&ev.target.closest('[data-desc]');
  if(!alvo) return;
  const d=itens[+alvo.getAttribute('data-desc')];
  if(!d) return;
  const txt=[String(d.titulo||'').trim(), String(d.descricao||'').trim()]
    .filter(Boolean).join(String.fromCharCode(10,10));
  if(!txt) return;
  const b=balao(); b.textContent=txt; b.style.display='block'; moverBalao(ev);
});
document.addEventListener('mousemove', ev=>{
  if(balao().style.display==='block' && ev.target.closest
     && ev.target.closest('[data-desc]')) moverBalao(ev);
});
document.addEventListener('mouseout', ev=>{
  if(ev.target.closest&&ev.target.closest('[data-desc]')) balao().style.display='none';
});

// ── Pintura ───────────────────────────────────────────────────────────────
const DM_COLS=['auto','58px','122px','128px','116px','82px','100px'];
const colgroup='<colgroup>'+DM_COLS.map(w=>'<col style="width:'+w+'">').join('')+'</colgroup>';
const cabecalho='<thead><tr>'
  +'<th>Demanda</th><th class="centrado">Prioridade</th>'
  +'<th>Entrega estimada</th><th>Status</th><th>Quem pediu</th>'
  +'<th>Entrada</th><th>Área</th></tr></thead>';

function pintarStats(){
  const abertas=itens.filter(d=>sInfo(d.status).v!=='entregue');
  const dentro=(a,b)=>abertas.filter(d=>{ const n=diasAte(d.prazo);
    return n!==null && n>=a && n<=b; }).length;
  const passou=abertas.filter(d=>{ const n=diasAte(d.prazo); return n!==null && n<0; }).length;
  const num=(n,l,cor)=>'<div class="stat1">'
    +'<span class="stat1__n"'+(cor?' style="color:'+cor+'"':'')+'>'+n+'</span>'
    +'<span class="stat1__l">'+l+'</span></div>';
  $('stats').innerHTML='<div class="stats">'
    +num(itens.length,'tickets no total')
    +num(dentro(0,7),'estimadas em 7 dias')
    +num(dentro(0,15),'estimadas em 15 dias')
    +(passou?num(passou,'estimativa passou','var(--cm-alta)'):'')
    +'<span class="stats__sep"></span>'
    +STATUS.map(o=>{
      const n=itens.filter(d=>sInfo(d.status).v===o.v).length;
      return '<span class="st-tot" style="--c:'+esc(o.cor)+'">'
        +'<span class="st-tot__n">'+n+'</span>'+esc(o.l)+'</span>';
    }).join('')
    +'</div>';
}

function pintar(){
  pintarStats();
  const el=$('lista');
  if(!itens.length){
    el.innerHTML='<div class="centro"><p>Nenhuma demanda publicada.</p></div>';
    return;
  }
  const grupos=new Map();
  itens.forEach((d,i)=>{
    const sp=sprintDe(d.prazo);
    const k=sp?sp.chave:'zz-sem-prazo';
    if(!grupos.has(k)) grupos.set(k,{sp,itens:[]});
    grupos.get(k).itens.push(Object.assign({_i:i}, d));
  });
  const ordenadas=[...grupos.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
  const hojeISO=dISO(hoje0());
  const fase=g=>{
    if(!g.sp) return 'sem';
    if(dISO(g.sp.fim) < hojeISO) return 'passada';
    if(dISO(g.sp.ini) > hojeISO) return 'futura';
    return 'atual';
  };
  const passadas=[], demais=[];
  ordenadas.forEach(e=>{ (fase(e[1])==='passada'?passadas:demais).push(e); });

  const bloco=([chave,g])=>{
    const lista=g.itens.slice().sort((a,b)=>{
      const p=prioNum(a.prioridade)-prioNum(b.prioridade);
      if(p) return p;
      return String(a.prazo||'9999').localeCompare(String(b.prazo||'9999'));
    });
    const f=fase(g);
    const abertas=lista.filter(d=>sInfo(d.status).v!=='entregue').length;
    const restam = f==='atual' ? Math.round((g.sp.fim-hoje0())/86400000)+1 : null;
    const selo = f==='atual'   ? '<span class="sp-selo sp-selo--atual">Sprint atual'
                                  +(restam!=null?' · '+(restam===1?'último dia':'faltam '+restam+' dias'):'')+'</span>'
               : f==='futura'  ? '<span class="sp-selo">a seguir</span>'
               : f==='passada' ? '<span class="sp-selo sp-selo--enc">encerrada</span>'
               : '<span class="sp-selo sp-selo--sem">sem data na planilha</span>';
    const fechada=spFechadas.has(chave);
    return '<div class="sp-bloco'+(f==='atual'?' sp-bloco--atual':'')+'">'
      +'<div class="sp-cab sp-cab--'+f+'" onclick="alternarSprint(\''+esc(chave)+'\')" '
        +'title="'+(fechada?'Abrir':'Recolher')+' esta sprint">'
        +'<span class="sp-seta">'+(fechada?'&#9656;':'&#9662;')+'</span>'
        +'<span class="sp-tit">'+esc(sprintTitulo(g.sp))+'</span>'+selo
        +'<span style="flex:1"></span>'
        +'<span class="sp-n">'+abertas+' em aberto'
          +(abertas!==lista.length?' <span style="opacity:.7">de '+lista.length+'</span>':'')+'</span>'
      +'</div>'
      +(fechada?''
      : '<div class="tbl-wrap"><table class="dm">'+colgroup+cabecalho+'<tbody>'
      +lista.map(d=>{
        const n=diasAte(d.prazo);
        const si=sInfo(d.status);
        const entregue=si.v==='entregue';
        const cls = entregue||n===null ? '' : (n<0?'prazo-venc':(n<=7?'prazo-perto':''));
        const temDesc=!!String(d.descricao||'').trim();
        const mostraBalao=temDesc || String(d.titulo||'').length>55;
        return '<tr'+(entregue?' style="opacity:.62"':'')+'>'
          +'<td class="dm-tit">'
            +'<span'+(mostraBalao?' class="tem-desc" data-desc="'+d._i+'"':'')+'>'
            +esc(d.titulo||'(sem título)')+'</span></td>'
          +'<td class="centrado">'+(d.prioridade===''||d.prioridade==null
            ? '<span class="suave">—</span>'
            : '<span class="prio">'+esc(d.prioridade)+'</span>')+'</td>'
          +'<td>'+(d.prazo
            ? '<span'+(cls?' class="'+cls+'"':'')+'>'+soData(d.prazo)+'</span>'
              +(!entregue&&n!==null
                ? '<div class="dt-obs '+cls+'">'
                  +(n<0?(-n)+'d além da estimativa':(n===0?'estimada para hoje':'faltam '+n+'d'))
                  +'</div>' : '')
            : '<span class="suave">—</span>')+'</td>'
          +'<td><span class="pill" style="background:'+esc(si.cor)+'">'+esc(si.l)+'</span></td>'
          +'<td>'+esc(d.solicitante||'—')+'</td>'
          +'<td class="suave">'+(d.entrada?soData(d.entrada):'—')+'</td>'
          +'<td>'+esc(d.area||'—')+'</td>'
          +'</tr>';
      }).join('')+'</tbody></table></div>')
    +'</div>';
  };

  const nEnc=passadas.reduce((a,[,g])=>a+g.itens.length,0);
  const encHtml = passadas.length
    ? '<button class="enc-tg" onclick="alternarEncerradas()">'
        +(verEncerradas?'&#9662;':'&#9656;')+' '
        +passadas.length+' sprint'+(passadas.length>1?'s':'')
        +' encerrada'+(passadas.length>1?'s':'')
        +' · '+nEnc+' demanda'+(nEnc>1?'s':'')
        +'<span class="enc-tg__x">'+(verEncerradas?'esconder':'mostrar')+'</span></button>'
      +(verEncerradas?'<div>'+passadas.map(bloco).join('')+'</div>':'')
    : '';

  el.innerHTML=demais.map(bloco).join('')+encHtml
    +'<div style="font-size:11.5px;color:var(--texto2);margin-top:10px">'
    +itens.length+' demanda(s) em '+ordenadas.length+' sprint(s)</div>';
}

async function abrir(){
  const token=(new URLSearchParams(location.search).get('p')||'').trim();
  if(!/^[a-z0-9]{16,64}$/i.test(token)){
    estado('Link inválido','Confira se o endereço foi copiado por inteiro.');
    return;
  }
  try{
    const snap=await window._pub.get('cm_publico', token);
    if(!snap.exists()){
      estado('Quadro não encontrado',
        'O link pode ter sido renovado ou o compartilhamento foi desativado por quem publicou.');
      return;
    }
    const p=snap.data()||{};
    // Painel de BI e lista de demandas dividem a mesma coleção pública. Se o
    // link cair na página errada, manda para a certa em vez de dar erro.
    if(p.tipo && p.tipo!=='demandas'){
      location.replace('painel.html?p='+encodeURIComponent(token));
      return;
    }
    itens=Array.isArray(p.itens)?p.itens:[];
    STATUS=Array.isArray(p.status)&&p.status.length?p.status:[];
    cadencia=(SPRINT_DIAS[p.cadencia]||p.cadencia==='mensal')?p.cadencia:'quinzenal';
    document.title=(p.titulo||'Demandas')+' — Udiaço';
    $('p-tit').textContent=p.titulo||'Demandas de tecnologia';
    $('p-sub').textContent=p.descricao||'';
    $('rodape').textContent='Quadro de leitura da Udiaço · atualizado em '
      +dataHora(p.atualizadoEm)+' · alterações são feitas somente na plataforma';
    $('estado').style.display='none';
    $('corpo').style.display='block';
    pintar();
  }catch(e){
    estado('Não foi possível abrir o quadro', String(e&&e.message||e));
  }
}
if(window._pub) abrir(); else window.addEventListener('pronto', abrir, {once:true});
</script>
