<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc,
           deleteDoc, onSnapshot, query, where, orderBy, writeBatch, increment }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Mesmo projeto Firebase do rhudi: os logins da equipe (Auth) e o controle de
  // acesso (coleção 'usuarios') são compartilhados. Aqui só as coleções são novas.
  const firebaseConfig = {
    apiKey:"AIzaSyDUD4CDg3zaZh9dM4_RXuxRmY9bV0YZAok",
    authDomain:"udiaco-beneficios.firebaseapp.com",
    projectId:"udiaco-beneficios",
    storageBucket:"udiaco-beneficios.firebasestorage.app",
    messagingSenderId:"27505050059",
    appId:"1:27505050059:web:1aa59e7b14bdc7b796364e"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app), auth = getAuth(app);

  window._auth = auth;
  window._col  = n => collection(db, n);
  window._doc  = (c, i) => doc(db, c, i);
  window._getDoc = getDoc;  window._getDocs = getDocs;
  window._addDoc = addDoc;  window._setDoc = setDoc;  window._updateDoc = updateDoc;
  window._deleteDoc = deleteDoc;
  window._onSnapshot = onSnapshot;
  window._query = query; window._where = where; window._orderBy = orderBy;
  window._batch = () => writeBatch(db);
  window._inc = n => increment(n);
  window._signIn = (e, p) => signInWithEmailAndPassword(auth, e, p);
  window._resetSenha = e => sendPasswordResetEmail(auth, e);
  window._signOut = () => signOut(auth);
  window._onAuthStateChanged = onAuthStateChanged;
  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<!-- Google Identity Services: só é usado para pedir o token do Drive na hora
     de criar a pasta de um projeto. Carrega em paralelo e não trava nada. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<!-- Sistema de design da Udiaço (o mesmo do rhudi) -->
<link rel="stylesheet" href="udiaco-design-system.css">

<style>
/* ============================================================
   PROJETOS ESTRATÉGICOS — camada visual
   Tokens (--accent, --border, --space-*) vêm do
   udiaco-design-system.css. Aqui vai a linguagem das referências
   visuais: status em bloco de cor cheia, grupos com título
   colorido, avatar do responsável, data em cor e progresso.
   ============================================================ */
*{ box-sizing:border-box }
html,body{ margin:0; padding:0; min-height:100% }
button{ font-family:inherit }
a{ color:var(--accent); text-decoration:none }

/* Cores de preenchimento do status: escurecidas o suficiente para
   texto branco legível (todas acima de 4.5:1 de contraste). */
:root{
  --brand:         #047857;   /* verde Udiaço (o mesmo do Sistema de RH) */
  --brand-escuro:  #065f46;
  --st-a_fazer:    #64748b;
  --st-andamento:  #2563eb;
  --st-futuro:     #0f766e;
  --st-aguardando: #b45309;
  --st-checar:     #7c3aed;
  --st-concluida:  #15803d;
  --cyan:          #0e7490;
}

/* ---------- LOGIN ---------- */
.login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6);
        background:radial-gradient(1200px 500px at 20% -10%, #dbeafe 0%, transparent 60%),
                   linear-gradient(160deg,#eef2ff 0%,var(--page-bg) 45%) }
.login__card{ width:100%; max-width:390px; background:var(--surface); border:1px solid var(--border);
        border-radius:18px; box-shadow:0 12px 40px rgba(15,23,42,.10); padding:var(--space-8) }
.login__logo{ width:46px; height:46px; border-radius:13px; background:var(--accent);
        color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:23px;
        box-shadow:0 6px 16px rgba(37,99,235,.35) }

/* ---------- LAYOUT ---------- */
.wrap{ max-width:1320px; margin:0 auto; padding:var(--space-6) }
.row{ display:flex; align-items:center; gap:var(--space-3) }
.row--between{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3) }
.spacer{ flex:1 }
.muted{ color:var(--text-muted) }
.small{ font-size:12px }
.page-title{ font-size:27px; font-weight:600; letter-spacing:-.02em }
.cabecalho{ position:sticky; top:0; z-index:30; background:var(--brand) }
/* Barra da plataforma no verde da Udiaço, com as abas dentro dela: sobra mais
   altura para o conteúdo e a barra fica igual à do Sistema de RH. */
.topbar{ background:var(--brand); border-bottom:none; color:#fff; gap:var(--space-4);
        padding:10px var(--space-6) }
.topbar__brand{ color:#fff; font-size:15px; white-space:nowrap }
.topbar__logo{ background:rgba(255,255,255,.18); color:#fff }
.topbar .small.muted{ color:rgba(255,255,255,.75) }
.topbar .btn{ background:rgba(255,255,255,.14); border-color:transparent; color:#fff; height:34px }
.topbar .btn:hover{ background:rgba(255,255,255,.26) }
.topbar .icon-btn{ color:rgba(255,255,255,.9) }
.topbar .icon-btn:hover{ background:rgba(255,255,255,.18); color:#fff }
.sino__badge{ box-shadow:0 0 0 2px var(--brand) }
.avatar-btn:hover{ box-shadow:0 0 0 3px rgba(255,255,255,.35) }

/* Abas: pílulas na barra verde */
.abas{ display:flex; align-items:center; gap:6px }
.aba{ display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 15px; border:none;
        border-radius:20px; background:rgba(255,255,255,.14); color:rgba(255,255,255,.92);
        font-family:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap;
        transition:background .15s, color .15s }
.aba:hover{ background:rgba(255,255,255,.26); color:#fff }
.aba--on{ background:#fff; color:var(--brand); font-weight:600 }
.aba i{ font-size:16px }
.aba__n{ background:rgba(255,255,255,.28); color:#fff; border-radius:20px; padding:0 7px;
        font-size:11px; font-weight:700; min-width:19px; text-align:center }
.aba--on .aba__n{ background:var(--brand); color:#fff }
@media (max-width:820px){
  .topbar{ flex-wrap:wrap; gap:var(--space-2) }
  .topbar__brand span,.topbar .small.muted{ display:none }
  .abas{ order:3; width:100%; overflow-x:auto; padding-bottom:2px }
}

/* Botão primário do app segue o verde da marca */
.btn--primary{ background:var(--brand); border-color:var(--brand) }
.btn--primary:hover{ background:var(--brand-escuro) }
.login__logo{ background:var(--brand); box-shadow:0 6px 16px rgba(4,120,87,.35) }
.nav__item{ background:none; border:none; border-bottom:2px solid transparent; font-family:inherit;
        font-size:14px; gap:7px }
.nav__count{ background:var(--surface-soft); color:var(--text-secondary); border-radius:20px;
        padding:1px 7px; font-size:11px; font-weight:600 }
.nav__item--active .nav__count{ background:var(--accent); color:var(--on-accent) }

/* ---------- STATUS: o bloco de cor ---------- */
.st{ display:inline-flex; align-items:center; justify-content:center; gap:5px; color:#fff;
     border-radius:20px; padding:4px 12px; font-size:12px; font-weight:600; white-space:nowrap;
     line-height:1.35 }
/* Na tabela a cor toma a célula inteira, de borda a borda: é o sinal mais
   forte da linha. O fio branco embaixo separa uma linha da outra. */
.tab td.cel-st{ text-align:center; color:#fff; font-weight:600;
        font-size:12.5px; border-bottom:2px solid var(--surface) }

/* ---------- AVATAR ---------- */
.avatar{ overflow:hidden; position:relative; font-weight:600 }
.avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.avatar--sm{ width:27px; height:27px; font-size:10px }
.avatar--lg{ width:44px; height:44px; font-size:14px }
.avatar-btn{ border:none; background:none; padding:0; cursor:pointer; border-radius:50%; line-height:0 }
.avatar-btn:hover{ box-shadow:0 0 0 3px var(--accent-bg) }
.mini-pes{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap }

/* ---------- SINO E NOTIFICAÇÕES ---------- */
.sino{ position:relative }
.sino__badge{ position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px;
        border-radius:20px; background:var(--danger); color:#fff; font-size:10px; font-weight:700;
        display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--surface) }
.notif-painel{ position:absolute; top:52px; right:var(--space-6); width:min(430px,calc(100vw - 32px));
        max-height:70vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border);
        border-radius:14px; box-shadow:0 16px 44px rgba(15,23,42,.16); z-index:70; display:none }
.notif-painel--on{ display:block }
.notif{ display:flex; gap:var(--space-3); width:100%; text-align:left; padding:var(--space-3) var(--space-4);
        border:none; border-bottom:1px solid var(--border); background:none; cursor:pointer; font-family:inherit }
.notif:hover{ background:var(--surface-soft) }
.notif--nova{ background:var(--accent-bg); box-shadow:inset 3px 0 0 var(--accent) }
.notif__txt{ flex:1; min-width:0; font-size:13px; color:var(--text) }
.notif__sub{ font-size:11px; color:var(--text-muted); margin-top:2px }

/* ---------- GRUPOS DA AGENDA ---------- */
.grupo{ margin-bottom:var(--space-6) }
.grupo__head{ display:flex; align-items:center; gap:var(--space-2); margin:0 0 var(--space-3);
        background:none; border:none; padding:0; cursor:pointer; font-family:inherit }
.grupo__titulo{ font-size:16px; font-weight:600; letter-spacing:-.01em }
.grupo__cont{ background:var(--surface-soft); color:var(--text-secondary); border-radius:20px;
        padding:1px 8px; font-size:11px; font-weight:600 }
.lista{ display:flex; flex-direction:column; gap:var(--space-2) }
.item{ display:flex; align-items:center; gap:var(--space-3); background:var(--surface);
        border:1px solid var(--border); border-left:4px solid var(--border-strong); border-radius:var(--radius);
        padding:var(--space-3) var(--space-4); cursor:pointer; transition:box-shadow .15s, transform .05s }
.item:hover{ box-shadow:var(--shadow-md) }
.item:active{ transform:scale(.998) }
.item--concluida{ opacity:.55 }
.item__main{ flex:1; min-width:0 }
.item__tit{ font-weight:500; color:var(--text); display:flex; align-items:center; gap:7px; flex-wrap:wrap }
.item__sub{ font-size:12px; color:var(--text-muted); margin-top:3px; display:flex; align-items:center;
        gap:var(--space-2); flex-wrap:wrap }
.dot{ width:5px; height:5px; border-radius:50%; background:var(--border-strong); flex-shrink:0 }
.pill{ border-radius:20px; padding:1px 8px; font-size:10px; font-weight:700; letter-spacing:.02em }
.pill--nova{ background:var(--accent); color:var(--on-accent) }
.reprog{ display:flex; align-items:center; gap:5px; background:var(--surface-soft); border:1px solid var(--border);
        border-radius:var(--radius-sm); padding:4px 8px; font-size:11px; color:var(--text-secondary) }
.reprog:hover{ border-color:var(--accent); color:var(--accent-text) }
.reprog input{ border:none; background:transparent; font-family:inherit; font-size:11px; color:var(--text);
        width:90px; outline:none; padding:0 }

/* ---------- MINHAS TAREFAS: agenda (esquerda) + kanban (direita) ---------- */
.wrap--largo{ max-width:1900px }

/* Agenda de planejamento, embaixo do quadro: os dias em grade, para usar a
   largura toda e nunca precisar de rolagem lateral. */
.ag{ margin-top:var(--space-5); background:var(--surface); border:1px solid var(--border);
      border-radius:14px; box-shadow:var(--shadow); padding:var(--space-4) var(--space-5) var(--space-5) }
.ag__tit{ display:flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:var(--text);
      letter-spacing:-.01em; margin-bottom:var(--space-4); flex-wrap:wrap }
.ag__tit i{ color:var(--accent) }
/* ---------- AGENDA DE PLANEJAMENTO ----------
   Dias em COLUNAS, itens como linha (bullet + título). De propósito nada de
   card e nada de coluna cinza: a faixa verde no topo e as colunas divididas
   só por um fio deixam claro que este painel é outra coisa que o quadro de
   estado que fica acima. */
.ag{ margin-top:var(--space-8); background:var(--surface); border:1px solid var(--border);
      border-radius:14px; box-shadow:var(--shadow); overflow:hidden }
.ag__faixa{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      padding:11px var(--space-5); background:var(--success-bg);
      border-bottom:1px solid var(--border); color:var(--brand); font-size:14px }
.ag__faixa i{ font-size:17px }
.ag__sub{ font-size:12px; color:var(--text-secondary) }
.ag__cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)) }
.ag__col{ padding:var(--space-4) var(--space-4) var(--space-5); border-left:1px solid var(--border);
      border-top:1px solid var(--border); margin-top:-1px }
.ag__col--vazia{ background:#fcfdfe }
.ag__cab{ display:flex; align-items:center; gap:6px; padding-bottom:7px; margin-bottom:8px;
      border-bottom:2px solid currentColor }
.ag__nome{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.ag__col--vazia .ag__cab{ opacity:.45 }
.ag__n{ font-size:10.5px; font-weight:700; color:var(--text-secondary); background:var(--surface-soft);
      border-radius:20px; padding:0 6px; flex-shrink:0 }
.ag__itens{ display:flex; flex-direction:column; gap:1px; min-height:44px; border-radius:8px;
      border:1.5px dashed transparent; padding:1px }
.ag__itens--alvo{ border-color:var(--brand); background:var(--success-bg) }
.ag__livre{ font-size:11.5px; color:var(--text-muted); font-style:italic; padding:3px 6px }
.it{ display:flex; align-items:flex-start; gap:7px; padding:4px 6px; border-radius:6px; cursor:grab;
      font-size:12.5px; line-height:1.35 }
.it:hover{ background:var(--surface-soft) }
.it__ponto{ width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:5px }
.it__tit{ flex:1; min-width:0; color:var(--text);
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.it__alerta{ color:var(--danger); flex-shrink:0; font-size:13px; margin-top:2px }
.it__risco{ color:var(--warning); flex-shrink:0; font-size:13px; margin-top:2px }

/* Kanban */
/* As seis colunas dividem a largura da tela em partes iguais. Nada de rolagem
   horizontal: em tela estreita elas quebram em 3 e depois em 2 por linha. */
.kanban{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:var(--space-2);
      align-items:start }
@media (max-width:1180px){ .kanban{ grid-template-columns:repeat(3,minmax(0,1fr)) } }
@media (max-width:900px){  .kanban{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
.col{ background:var(--surface-soft); border:1px solid var(--border); border-radius:14px;
      display:flex; flex-direction:column; min-width:0 }
.col__head{ display:flex; align-items:center; gap:6px; padding:10px 10px 10px 0;
      border-bottom:1px solid var(--border); border-radius:14px 14px 0 0; background:var(--surface) }
.col__marca{ width:5px; align-self:stretch; border-radius:0 3px 3px 0; flex-shrink:0 }
.col__tit{ flex:1; min-width:0; font-size:10.5px; font-weight:700; letter-spacing:.04em; line-height:1.25 }
.col__n{ background:var(--surface-soft); color:var(--text-secondary); border-radius:20px; padding:1px 7px;
      font-size:11px; font-weight:700 }
.col__corpo{ padding:10px; display:flex; flex-direction:column; gap:8px; min-height:74px;
      max-height:min(58vh,640px); overflow-y:auto }
.col--alvo{ outline:2px dashed var(--accent); outline-offset:-2px }
.col--alvo .col__corpo{ background:var(--accent-bg) }
/* Card de ALTURA FIXA: título em até duas linhas e uma linha de rodapé. Cards
   do mesmo tamanho deixam a coluna legível de relance. */
.card{ background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--border-strong);
      border-radius:10px; padding:8px 10px; cursor:pointer; box-shadow:var(--shadow);
      height:70px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden }
.card:hover{ box-shadow:var(--shadow-md) }
.card--arrasta{ opacity:.35 }
/* Onde o card vai entrar na coluna */
.card--cima{ box-shadow:0 -4px 0 -1px var(--accent), var(--shadow-md) }
.card--baixo{ box-shadow:0 4px 0 -1px var(--accent), var(--shadow-md) }
.card__tit{ font-size:12.5px; font-weight:500; color:var(--text); line-height:1.3;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.card__meta{ display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--text-muted);
      white-space:nowrap; overflow:hidden }
.card__meta span{ display:inline-flex; align-items:center; gap:3px; flex-shrink:0 }
/* O contexto é o único que encolhe: os sinais da direita têm de caber sempre. */
.card__ctx{ min-width:0; flex:1 1 auto !important; overflow:hidden; text-overflow:ellipsis;
      display:block !important }
.card__alerta{ color:var(--danger-text); font-weight:600 }
.card__risco{ color:var(--warning-text); font-weight:600 }
.card--concluido .card__tit{ text-decoration:line-through; color:var(--text-muted) }
.mais-col{ font-size:11px; color:var(--text-muted); text-align:center; padding:4px }
.dica-arrasta{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary);
      background:var(--accent-bg); border-radius:10px; padding:8px 12px; margin-bottom:var(--space-4) }

/* ---------- PEÇAS DA TABELA ---------- */
.chat-ind{ display:inline-flex; align-items:center; gap:3px; font-size:11px; color:var(--text-muted);
        background:var(--surface-soft); border-radius:20px; padding:1px 7px; margin-left:2px }
.chat-ind--novo{ background:var(--accent); color:#fff; font-weight:700 }
.cel-edit{ cursor:pointer }
.cel-edit__txt{ display:inline-block; padding:3px 7px; border:1px dashed transparent; border-radius:var(--radius-sm) }
.cel-edit:hover .cel-edit__txt{ border-color:var(--border-strong); background:var(--surface-soft) }
.cel-edit input{ border:1px solid var(--accent); background:var(--surface); border-radius:var(--radius-sm);
        font-family:inherit; font-size:13px; color:var(--text); padding:3px 5px; width:140px;
        box-shadow:0 0 0 3px var(--accent-bg); outline:none }
.pilha{ display:flex; height:7px; width:130px; border-radius:20px; overflow:hidden; background:var(--surface-soft);
        flex-shrink:0 }
.pilha span{ height:100% }

/* ---------- MENU "..." ---------- */
.menu-wrap{ position:relative }
.menu{ position:absolute; top:36px; right:0; min-width:212px; background:var(--surface);
        border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 40px rgba(15,23,42,.18);
        z-index:75; padding:6px; display:none }
.menu--on{ display:block }
.menu button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none;
        background:none; font-family:inherit; font-size:13.5px; color:var(--text); padding:9px 10px;
        border-radius:8px; cursor:pointer }
.menu button:hover{ background:var(--surface-soft) }
.menu button.perigo{ color:var(--danger-text) }
.menu hr{ border:none; border-top:1px solid var(--border); margin:5px 2px }

/* ---------- ABAS DO TICKET ---------- */
.tk-abas{ display:flex; gap:2px; padding:0 var(--space-5); border-bottom:1px solid var(--border);
        background:var(--surface) }
.tk-aba{ display:flex; align-items:center; gap:7px; padding:11px 12px; border:none; background:none;
        font-family:inherit; font-size:13.5px; color:var(--text-secondary); cursor:pointer;
        border-bottom:2px solid transparent }
.tk-aba:hover{ color:var(--text) }
.tk-aba--on{ color:var(--accent); font-weight:600; border-bottom-color:var(--accent) }
.tk-aba span{ background:var(--surface-soft); border-radius:20px; padding:0 6px; font-size:11px; font-weight:700 }
.tk-aba--on span{ background:var(--accent); color:#fff }

/* Cartão de atualização (uma por bloco, como na referência) */
.upd{ border:1px solid var(--border); border-radius:12px; margin-bottom:var(--space-3); overflow:hidden }
.upd--nova{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
.upd__head{ display:flex; align-items:center; gap:10px; padding:var(--space-3) var(--space-4) }
.upd__nome{ font-weight:600; color:var(--text); font-size:13.5px }
.upd__hora{ font-size:12px; color:var(--text-muted) }
.upd__corpo{ padding:0 var(--space-4) var(--space-4); font-size:13.5px; color:var(--text);
        white-space:pre-wrap; word-break:break-word }
.hist{ display:flex; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border); font-size:12.5px;
        color:var(--text-secondary); align-items:flex-start }
.hist:last-child{ border-bottom:none }
.arq-lista{ display:flex; flex-direction:column; gap:8px }
.arq{ display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--border);
        border-radius:10px; text-decoration:none; color:var(--text) }
.arq:hover{ border-color:var(--accent); background:var(--accent-bg) }
.arq__ico{ width:34px; height:34px; border-radius:9px; background:var(--accent-bg); color:var(--accent-text);
        display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0 }
.arq__nome{ flex:1; min-width:0; font-size:13.5px; font-weight:500 }
.arq--pasta{ border-color:var(--success); background:var(--success-bg) }
.arq--pasta:hover{ border-color:var(--success); background:#e7f8ed }
.ctx-drive{ display:inline-flex; align-items:center; color:var(--success-text); font-size:14px;
        text-decoration:none; vertical-align:-2px }
.ctx-drive:hover{ color:var(--success) }

/* ---------- BARRA DE FERRAMENTAS ---------- */
.toolbar{ display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap;
        margin-bottom:var(--space-5) }
.busca{ display:flex; align-items:center; gap:8px; height:38px; padding:0 var(--space-3);
        background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
        color:var(--text-muted); min-width:250px }
.busca:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
.busca input{ border:none; background:transparent; outline:none; flex:1; font-size:14px;
        color:var(--text); font-family:inherit }
.alterna{ display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 var(--space-3);
        border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
        font-size:13px; color:var(--text-secondary); cursor:pointer; white-space:nowrap }
.alterna:hover{ border-color:var(--border-strong) }
.alterna--on{ border-color:var(--accent); background:var(--accent-bg); color:var(--accent-text); font-weight:500 }

/* ---------- BLOCO DE PROJETO E TABELA ---------- */
.proj-bloco{ background:var(--surface); border:1px solid var(--border); border-radius:14px;
        box-shadow:var(--shadow); margin-bottom:var(--space-5); overflow:hidden }
.proj-bloco__head{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4) var(--space-5);
        flex-wrap:wrap }
.proj-bloco__nome{ font-size:17px; font-weight:600; color:var(--text); cursor:pointer; letter-spacing:-.01em;
        display:flex; align-items:center; gap:9px; background:none; border:none; font-family:inherit; padding:0 }
.proj-bloco__nome:hover{ color:var(--accent) }
.prog{ height:6px; width:110px; border-radius:20px; background:var(--surface-soft); overflow:hidden; flex-shrink:0 }
.prog__fill{ height:100%; border-radius:20px; background:var(--st-concluida); transition:width .3s }
.prog--mini{ height:4px; width:64px; display:inline-block; vertical-align:middle }

.tab-wrap{ overflow-x:auto }
.tab{ width:100%; border-collapse:collapse; font-size:13.5px }
.tab th{ text-align:left; padding:9px var(--space-4); font-weight:600; font-size:11px; letter-spacing:.05em;
        text-transform:uppercase; color:var(--text-muted); background:var(--surface-soft);
        border-top:1px solid var(--border); border-bottom:1px solid var(--border); white-space:nowrap }
.tab td{ padding:6px var(--space-4); border-bottom:1px solid var(--border); color:var(--text-secondary);
        vertical-align:middle }
/* Largura fixa por coluna: é o que deixa o título cortar com "..." em vez de
   quebrar a linha. Cada demanda ocupa uma linha só. */
.tab--fixa{ table-layout:fixed }
.tab--fixa td{ overflow:hidden }
/* Na tabela o avatar é menor: era ele que segurava a altura da linha. */
.tab .avatar--sm{ width:22px; height:22px; font-size:9px }
.tab .mini-pes{ gap:7px }
.tab .chat-ind{ font-size:10.5px; padding:0 6px }
.tab tbody tr{ cursor:pointer }
.tab tbody tr:hover td{ background:#f9fbfe }
.tab tr.lin--concluida .demanda__tit{ text-decoration:line-through; color:var(--text-muted) }
.tab .cel-dem{ border-left:4px solid transparent }
.tab .cel-resp{ white-space:nowrap }
.demanda{ display:flex; align-items:center; gap:8px; min-width:0 }
.demanda__tit{ color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis; min-width:0 }
/* Linha de FRENTE dentro da tabela do projeto: subdivisão, não é demanda */
.tab tr.fr td{ background:var(--surface-soft); border-bottom:1px solid var(--border);
        padding:7px var(--space-4); cursor:pointer }
.tab tr.fr:hover td{ background:#eef2f7 }
.fr__linha{ display:flex; align-items:center; gap:9px }
.fr__nome{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase }
.fr__n{ font-size:11px; color:var(--text-muted) }
.fr__acao{ display:inline-flex; align-items:center; gap:5px; border:1px solid transparent; background:none;
        font-family:inherit; font-size:11.5px; color:var(--text-secondary); cursor:pointer;
        padding:2px 8px; border-radius:20px; opacity:.45; transition:opacity .12s }
.tab tr.fr:hover .fr__acao{ opacity:1 }
.fr__acao:hover{ border-color:var(--border-strong); background:var(--surface); color:var(--accent) }
.tab tr.fr-vazia td{ padding:8px var(--space-4) 8px 42px; font-size:11.5px; color:var(--text-muted);
        font-style:italic; background:var(--surface) }

.sub-cont{ flex-shrink:0; font-size:10.5px; font-weight:700; color:var(--text-secondary);
        background:var(--surface-soft); border-radius:20px; padding:1px 7px; font-variant-numeric:tabular-nums }
.ramo{ color:var(--border-strong); flex-shrink:0; font-size:15px }
.nivel-1 .demanda{ padding-left:20px }
.nivel-2 .demanda{ padding-left:42px }
.data-cel{ white-space:nowrap; font-variant-numeric:tabular-nums }
.data-cel--vencida{ color:var(--danger-text); font-weight:600 }
.data-cel--hoje{ color:var(--accent-text); font-weight:600 }
.data-cel--risco{ color:var(--warning-text); font-weight:600 }
/* Círculo de concluir, como nas referências */
.tick{ width:19px; height:19px; flex-shrink:0; border-radius:50%; cursor:pointer;
        border:1.5px solid var(--border-strong); background:var(--surface); color:transparent;
        display:flex; align-items:center; justify-content:center; font-size:12px; padding:0;
        transition:border-color .12s, color .12s, background .12s }
.tick:hover{ border-color:var(--st-concluida); color:var(--st-concluida) }
.tick--ok{ background:var(--st-concluida); border-color:var(--st-concluida); color:#fff }
.chevron{ width:19px; height:19px; flex-shrink:0; border:none; background:none; padding:0;
        cursor:pointer; color:var(--text-muted); font-size:15px; display:flex; align-items:center }
.chevron:hover{ color:var(--text) }

/* ---------- PAINEL DO TICKET ---------- */
.backdrop{ position:fixed; inset:0; background:rgba(15,23,42,.38); opacity:0; pointer-events:none;
        transition:opacity .2s; z-index:40 }
.backdrop--on{ opacity:1; pointer-events:auto }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(720px,100%); background:var(--surface);
        box-shadow:-10px 0 40px rgba(15,23,42,.16); transform:translateX(100%);
        transition:transform .22s ease; z-index:50; display:flex; flex-direction:column }
.drawer--on{ transform:translateX(0) }
.drawer__body{ flex:1; overflow-y:auto }
.icon-btn{ width:32px; height:32px; border-radius:var(--radius-sm); border:1px solid transparent;
        background:none; color:var(--text-muted); cursor:pointer; display:inline-flex;
        align-items:center; justify-content:center; font-size:18px }
.icon-btn:hover{ background:var(--surface-soft); color:var(--text) }

.tk-head{ padding:var(--space-4) var(--space-5); border-bottom:1px solid var(--border) }
.tk-ctx{ font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.tk-tit{ font-size:19px; font-weight:600; line-height:1.3; letter-spacing:-.015em; color:var(--text);
        margin:7px 0 0; display:flex; align-items:flex-start; gap:8px }
.tk-tit__edit{ opacity:0; transition:opacity .15s }
.tk-head:hover .tk-tit__edit{ opacity:1 }
.tk-chips{ display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-3) }
.chip{ display:inline-flex; align-items:center; gap:7px; background:var(--surface-soft);
        border:1px solid var(--border); border-radius:20px; padding:4px 11px 4px 4px; font-size:12.5px;
        color:var(--text-secondary); cursor:pointer }
.chip:hover{ border-color:var(--border-strong); background:var(--surface) }
.chip--plain{ padding-left:11px }
.chip b{ color:var(--text); font-weight:600 }
.chip i.ti-chevron-down{ font-size:13px; opacity:.5 }
/* Chip de status: a própria cor do status, e clicável para trocar */
.chip--rot{ border-color:var(--brand); color:var(--brand) }
.chip--rot b{ color:var(--brand) }
.chip--st{ color:#fff; font-weight:600; padding:4px 10px }
.chip--st:hover{ filter:brightness(1.08) }
.chip--st b{ color:#fff }
.chip input[type=date]{ border:none; background:transparent; font-family:inherit; font-size:12.5px;
        color:var(--text); outline:none; width:120px }

/* ---------- POPOVER (trocar status / responsável) ---------- */
.pop{ position:fixed; z-index:85; min-width:214px; max-height:60vh; overflow-y:auto; background:var(--surface);
        border:1px solid var(--border); border-radius:12px; box-shadow:0 16px 44px rgba(15,23,42,.20);
        padding:6px; display:none }
.pop--on{ display:block }
.pop a{ display:flex; align-items:center; gap:9px; width:100%; text-decoration:none;
        font-size:13px; color:var(--text); padding:8px 9px; border-radius:8px }
.pop a:hover{ background:var(--surface-soft) }
.pop button{ display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none;
        background:none; font-family:inherit; font-size:13px; color:var(--text); padding:8px 9px;
        border-radius:8px; cursor:pointer }
.pop button:hover{ background:var(--surface-soft) }
.pop button.pop--sel{ background:var(--accent-bg); font-weight:600 }
.pop__ponto{ width:10px; height:10px; border-radius:50%; flex-shrink:0 }
.pop__lab{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
        color:var(--text-muted); padding:6px 9px 3px }

/* ---------- CONVERSA EM DESTAQUE (o coração do ticket) ---------- */
.conv{ background:var(--page-bg); border-top:1px solid var(--border); padding:var(--space-5);
        min-height:340px }
.conv__tit{ display:flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:var(--text);
        letter-spacing:-.01em; margin-bottom:var(--space-4) }
.conv__tit i{ color:var(--accent) }
.comp{ display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--border);
        border-radius:14px; padding:var(--space-3); box-shadow:var(--shadow) }
.comp:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
.comp__corpo{ flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--space-2) }
.comp textarea{ width:100%; min-height:62px; max-height:220px; resize:vertical; padding:8px 4px;
        border:none; outline:none; font-family:inherit; font-size:14px; color:var(--text); background:transparent }
.upd{ border:1px solid var(--border); border-radius:14px; margin-bottom:var(--space-3); overflow:hidden;
        background:var(--surface); box-shadow:var(--shadow) }
.upd--nova{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
.upd__head{ display:flex; align-items:center; gap:10px; padding:var(--space-3) var(--space-4) 6px }
.upd__nome{ font-weight:600; color:var(--text); font-size:14px }
.upd__hora{ font-size:12px; color:var(--text-muted) }
.upd__corpo{ padding:0 var(--space-4) var(--space-4) 51px; font-size:14px; color:var(--text); line-height:1.55;
        white-space:pre-wrap; word-break:break-word }
/* Rodapé da atualização (curtir / responder) e a resposta aninhada */
.upd__pe{ display:flex; align-items:center; gap:var(--space-4); padding:7px var(--space-4);
        border-top:1px solid var(--border) }
.upd__acao{ display:inline-flex; align-items:center; gap:6px; border:none; background:none;
        font-family:inherit; font-size:12.5px; color:var(--text-secondary); cursor:pointer; padding:2px 0 }
.upd__acao:hover{ color:var(--accent) }
.upd__acao--on{ color:var(--accent); font-weight:600 }
.upd__resp{ border-top:1px solid var(--border); background:var(--surface-soft);
        padding:var(--space-3) var(--space-4); display:flex; flex-direction:column; gap:var(--space-3) }
.resp{ display:flex; gap:9px; align-items:flex-start }
.resp__meta{ font-size:11.5px; color:var(--text-muted) }
.resp__meta b{ color:var(--text); font-size:12.5px }
.resp__txt{ font-size:13.5px; color:var(--text); white-space:pre-wrap; word-break:break-word; margin-top:2px }
.resp__campo{ width:100%; min-height:54px; resize:vertical; border:1px solid var(--border); border-radius:10px;
        padding:9px 11px; font-family:inherit; font-size:13.5px; color:var(--text); background:var(--surface) }
.resp__campo:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
/* Ícones do compositor: sem moldura, dentro da caixa, como na referência */
.comp__ico{ width:31px; height:31px; border-radius:9px; border:none; background:none; color:var(--text-muted);
        cursor:pointer; font-size:17px; display:inline-flex; align-items:center; justify-content:center }
.comp__ico:hover{ background:var(--surface-soft); color:var(--accent) }
/* Criar subtarefa direto na linha da tabela do projeto */
.linha-add{ opacity:.4; width:21px; height:21px; border-radius:6px;
        border:1px dashed var(--border-strong); background:var(--surface); color:var(--text-muted);
        cursor:pointer; font-size:12px; display:inline-flex; align-items:center; justify-content:center;
        flex-shrink:0; transition:opacity .12s }
.tab tbody tr:hover .linha-add{ opacity:1; border-style:solid }
.linha-add:hover{ border-color:var(--accent); color:var(--accent); border-style:solid }
/* Alça de arraste: reordenar sem perder o clique da linha (que abre o ticket) */
.alca{ display:inline-flex; align-items:center; justify-content:center; width:16px; flex-shrink:0;
        color:var(--border-strong); cursor:grab; font-size:15px; margin-left:-4px }
.alca:hover{ color:var(--text-secondary) }
.alca:active{ cursor:grabbing }
.alca--proj{ width:18px; font-size:17px; margin:0 -2px 0 -6px }
/* Onde a linha vai entrar */
.tab tbody tr.alvo-cima td{ box-shadow:inset 0 3px 0 var(--accent) }
.tab tbody tr.alvo-baixo td{ box-shadow:inset 0 -3px 0 var(--accent) }
.tab tbody tr.fr.fr-alvo td{ background:var(--accent-bg); box-shadow:inset 0 0 0 2px var(--accent) }
.proj-bloco.pj-cima{ box-shadow:0 -4px 0 -1px var(--accent), var(--shadow) }
.proj-bloco.pj-baixo{ box-shadow:0 4px 0 -1px var(--accent), var(--shadow) }

/* Excluir a demanda na própria linha. Discreto por padrão, vermelho ao mirar. */
.linha-del{ opacity:.3; width:21px; height:21px; border-radius:6px; border:1px solid transparent;
        background:none; color:var(--text-muted); cursor:pointer; font-size:12px;
        display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
        transition:opacity .12s, color .12s }
.tab tbody tr:hover .linha-del{ opacity:.7 }
.linha-del:hover{ opacity:1; color:var(--danger); border-color:var(--danger); background:var(--danger-bg) }

.sit__quem{ display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border);
        border-radius:20px; padding:1px 9px 1px 2px; font-weight:600; color:var(--text); white-space:nowrap }

.sec{ padding:var(--space-5); border-bottom:1px solid var(--border) }
.sec__lab{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
        color:var(--text-muted); margin-bottom:var(--space-3) }
.sit{ border:1px solid var(--border); border-left:4px solid var(--border-strong); border-radius:var(--radius);
        overflow:hidden }
.sit__topo{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-4);
        background:var(--surface-soft) }
.sit__txt{ flex:1; min-width:0; font-size:13px; color:var(--text-secondary) }
.sit__acoes{ display:flex; flex-wrap:wrap; gap:var(--space-2); padding:var(--space-3) }
.acao{ display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--border-strong);
        border-radius:var(--radius); background:var(--surface); font-size:13px; font-weight:500;
        color:var(--text); cursor:pointer; font-family:inherit; text-align:left }
.acao:hover{ background:var(--surface-soft) }
.acao--ativa{ border-color:var(--accent); color:var(--accent-text); background:var(--accent-bg) }
.acao--ok{ border-color:var(--st-concluida); color:#fff; background:var(--st-concluida) }
.acao--ok:hover{ filter:brightness(1.07); background:var(--st-concluida) }
.acao i{ font-size:16px }
.marca-sys{ width:27px; height:27px; border-radius:50%; background:var(--surface-soft); color:var(--text-muted);
        display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0 }

.mini-lista{ display:flex; flex-direction:column; gap:6px }
.mini{ display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--border);
        border-left:4px solid var(--border-strong); border-radius:var(--radius); background:var(--surface);
        cursor:pointer; font-size:13px }
.mini:hover{ box-shadow:var(--shadow) }
.mini__tit{ flex:1; min-width:0; color:var(--text) }
.selo-vis{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-soft);
        border:1px solid var(--border); border-radius:20px; padding:2px 10px; font-size:11.5px;
        font-weight:600; color:var(--text-secondary); white-space:nowrap }
.mini__acao{ display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border-strong);
        background:var(--surface); font-family:inherit; font-size:11.5px; color:var(--text-secondary);
        padding:3px 9px; border-radius:20px; cursor:pointer; flex-shrink:0 }
.mini__acao:hover{ border-color:var(--accent); color:var(--accent-text); background:var(--accent-bg) }

/* ---------- CONVERSA ---------- */
.fila{ display:flex; flex-wrap:wrap; gap:6px }
.anexo{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:var(--surface);
        border:1px solid var(--border); border-radius:20px; font-size:12px;
        color:var(--accent-text); cursor:pointer; text-decoration:none }
.anexo:hover{ border-color:var(--accent) }
.tag-pessoa{ display:inline-flex; align-items:center; gap:5px; background:var(--purple-bg);
        color:var(--purple-text); border-radius:20px; padding:2px 9px; font-size:11px; font-weight:600; cursor:pointer }
.linha-tempo{ display:flex; flex-direction:column; margin-top:var(--space-4) }
.ev{ display:flex; gap:var(--space-3) }
.ev__col{ display:flex; flex-direction:column; align-items:center; flex-shrink:0 }
.ev__linha{ flex:1; width:2px; background:var(--border); margin:4px 0 }
.ev__corpo{ flex:1; min-width:0; padding-bottom:var(--space-4) }
.ev__meta{ font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:7px; flex-wrap:wrap }
.ev__nome{ font-weight:600; color:var(--text); font-size:12.5px }
.ev__texto{ font-size:13px; color:var(--text); white-space:pre-wrap; word-break:break-word; margin-top:3px }
.ev__caixa{ background:var(--surface-soft); border-radius:12px; border-top-left-radius:4px;
        padding:var(--space-3); margin-top:5px }
.ev--sys .ev__texto{ color:var(--text-secondary); font-size:12px }
.ev--nova .ev__caixa{ background:var(--accent-bg); box-shadow:inset 3px 0 0 var(--accent) }

/* ---------- MODAL ---------- */
.modal{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
        padding:var(--space-5); background:rgba(15,23,42,.42) }
.modal--on{ display:flex }
.modal__card{ width:100%; max-width:510px; max-height:90vh; overflow-y:auto; background:var(--surface);
        border-radius:16px; box-shadow:0 24px 60px rgba(15,23,42,.24) }
.modal__head{ padding:var(--space-5) var(--space-5) 0; font-size:17px; font-weight:600; letter-spacing:-.01em }
.modal__body{ padding:var(--space-5) }
.modal__foot{ padding:0 var(--space-5) var(--space-5); display:flex; justify-content:flex-end; gap:var(--space-2) }
.fg{ margin-bottom:var(--space-4) }
.fg label{ display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px }
.fg input,.fg select,.fg textarea{ width:100%; border:1px solid var(--border); border-radius:var(--radius);
        background:var(--surface); font-size:14px; color:var(--text); font-family:inherit; padding:9px var(--space-3) }
.fg textarea{ min-height:80px; resize:vertical }
.fg input:focus,.fg select:focus,.fg textarea:focus{ outline:none; border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-bg) }
.fg-dupla{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3) }
.ajuda{ font-size:11px; color:var(--text-muted); margin-top:4px }
.erro{ display:none; background:var(--danger-bg); color:var(--danger-text); border-radius:var(--radius);
        padding:var(--space-3); font-size:13px; margin-bottom:var(--space-4) }

/* ---------- DIVERSOS ---------- */
.stat{ border-radius:12px }
.stat__value{ letter-spacing:-.02em }
.vazio{ text-align:center; padding:var(--space-8) var(--space-5); color:var(--text-muted) }
.vazio i{ font-size:36px; display:block; margin-bottom:var(--space-3); opacity:.45 }
.aviso-versao{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:95;
        display:flex; align-items:center; gap:12px; background:var(--text); color:#fff;
        padding:10px 12px 10px 18px; border-radius:12px; box-shadow:0 12px 34px rgba(15,23,42,.34);
        font-size:13.5px; max-width:92vw }
.aviso-versao .btn{ height:32px; background:rgba(255,255,255,.16); border-color:transparent; color:#fff }
.aviso-versao .btn:hover{ background:rgba(255,255,255,.3) }
.aviso-versao .icon-btn{ color:rgba(255,255,255,.75) }
.aviso-versao .icon-btn:hover{ background:rgba(255,255,255,.16); color:#fff }
#toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
        background:var(--text); color:#fff; padding:11px 20px; border-radius:12px;
        font-size:13px; opacity:0; pointer-events:none; transition:all .2s; z-index:90; max-width:90vw;
        box-shadow:0 10px 30px rgba(15,23,42,.3) }
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
/* ============================================================
   CELULAR
   ============================================================
   Duas telas não cabem em 390px como estão: o quadro de seis colunas e a
   tabela de projeto de cinco colunas. No celular o quadro vira uma coluna
   por vez (empilhada, com as vazias recolhidas no cabeçalho) e cada linha
   da tabela vira um bloco de duas linhas. Nada rola na horizontal. */
@media (max-width:760px){
  .campos,.fg-dupla{ grid-template-columns:1fr }
  .wrap{ padding:var(--space-4) var(--space-3) }
  .notif-painel{ right:var(--space-2); left:var(--space-2); width:auto }
  .busca{ min-width:0; flex:1 1 100% }        /* a busca ganha a linha inteira */
  .toolbar .alterna{ flex:1 1 auto; justify-content:center }
  .page-title{ font-size:22px }
  .modal{ padding:var(--space-3) }
  .modal__card{ max-height:94vh }

  /* Quadro: uma coluna por vez, empilhada */
  .kanban{ grid-template-columns:1fr; gap:var(--space-3) }
  .col__corpo{ max-height:none }
  .col__tit{ font-size:11.5px }
  .col--vazia .col__corpo{ display:none }          /* vazia mostra só o cabeçalho */
  .col--vazia{ opacity:.7 }
  .card{ height:auto; min-height:62px }            /* no celular sobra largura: o título cabe */
  .card__tit{ font-size:13.5px; -webkit-line-clamp:3 }

  /* Agenda: um dia por linha */
  .ag{ margin-top:var(--space-5) }
  .ag__cols{ grid-template-columns:1fr }
  .ag__col{ border-left:none; border-top:1px solid var(--border); padding:var(--space-3) var(--space-4) }
  .ag__col--vazia{ display:none }                  /* dia sem nada não ocupa tela no celular */
  .ag__faixa{ padding:10px var(--space-4) }
  .ag__sub{ display:none }
  .it__tit{ -webkit-line-clamp:3 }

  /* Tabela do projeto: cada linha vira um bloco de duas linhas */
  .tab--fixa{ table-layout:auto }
  .tab colgroup,.tab thead{ display:none }
  .tab,.tab tbody{ display:block; width:100% }
  .tab tbody tr{ display:flex; flex-wrap:wrap; align-items:center; gap:5px 9px;
        padding:9px 12px 10px; border-bottom:1px solid var(--border) }
  .tab tbody tr td{ display:inline-flex; align-items:center; border:none; padding:0; width:auto;
        overflow:visible }
  /* a barra colorida do status continua vindo do border-left (cor no inline) */
  .tab tbody tr td.cel-dem{ flex:1 1 100%; padding-left:8px }
  /* na largura do celular o título quebra em vez de cortar: sobra linha, não largura */
  .tab .demanda__tit{ white-space:normal; overflow:visible; text-overflow:clip; line-height:1.35 }
  .tab .demanda{ align-items:flex-start }
  .tab .tick,.tab .chevron,.tab .ramo{ margin-top:2px }
  .tab td.cel-resp{ order:1 }
  .tab td.cel-st{ order:2; border-radius:20px; padding:3px 11px; font-size:11px; width:auto;
        text-align:left; border-bottom:none }
  .tab td.data-cel{ order:3; font-size:12px; gap:4px }
  .tab td.data-cel::before{ content:attr(data-rot) ": "; color:var(--text-muted); font-size:10.5px;
        text-transform:uppercase; letter-spacing:.03em }
  .nivel-1 .demanda{ padding-left:14px }
  .nivel-2 .demanda{ padding-left:28px }
  .linha-add,.linha-del{ opacity:.65 }
  .alca{ display:none }                            /* arrastar não funciona em toque */

  /* Faixa de frente e cabeçalho do projeto */
  .tab tbody tr.fr{ display:block; padding:0 }
  .tab tbody tr.fr td{ display:block; width:100%; padding:8px 12px }
  .tab tbody tr.fr-vazia td{ padding-left:18px }
  .fr__acao{ opacity:.8 }
  .proj-bloco__head{ padding:var(--space-3) var(--space-4); gap:var(--space-2) }
  .proj-bloco__nome{ font-size:15px; flex:1 1 100% }
  .pilha{ display:none }
  .alca--proj{ display:none }

  /* Ticket ocupa a tela inteira */
  .drawer{ width:100% }
  .tk-abas{ padding:0 var(--space-3); overflow-x:auto }   /* as três abas cabem rolando */
  .tk-aba{ padding:11px 9px; font-size:13px; white-space:nowrap }
  .tk-head{ padding:var(--space-3) var(--space-4) }
  .tk-tit{ font-size:17px }
  .sec,.conv{ padding:var(--space-4) }
  .upd__corpo{ padding-left:var(--space-4) }
  .aviso-versao{ left:var(--space-3); right:var(--space-3); transform:none; max-width:none }
}
@media (max-width:420px){
  .topbar{ padding:8px var(--space-3) }
  .aba{ padding:0 11px; font-size:13px }
  .card__meta{ font-size:10px }
  .ag__faixa b{ font-size:13px }
}

/* ---------- LABORATÓRIO (aba particular) ---------- */
.lab-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  flex-wrap:wrap; margin-bottom:var(--space-5) }
.lab-tit{ font-size:18px; font-weight:700; color:var(--text); margin:0 0 2px }
.lab-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:var(--space-4) }
.lab-card{ background:var(--surface); border:1px solid var(--border);
  border-top:3px solid var(--accent); border-radius:var(--radius);
  padding:var(--space-4); display:flex; flex-direction:column; gap:5px }
.lab-card__t{ font-size:14px; font-weight:600; color:var(--text); line-height:1.3 }
.lab-card__d{ font-size:12px; color:var(--text-secondary); line-height:1.4 }
.lab-card__m{ font-size:11px; color:var(--text-muted) }
.lab-card__a{ display:flex; gap:6px; margin-top:auto; padding-top:9px; flex-wrap:wrap }
.lab-card__a .btn{ height:30px; padding:0 10px; font-size:12px }
.lab-del{ color:var(--danger-text) }
.lab-del:hover{ border-color:var(--danger-text) }

/* Visor: o teste ocupa a tela inteira, mas dentro de um iframe isolado. */
.lab-visor{ position:fixed; inset:0; z-index:120; background:var(--surface);
  display:flex; flex-direction:column }
.lab-visor__bar{ display:flex; align-items:center; gap:12px; padding:9px 14px;
  border-bottom:1px solid var(--border); background:var(--surface-soft,#f8fafc); flex-shrink:0 }
.lab-visor__t{ font-weight:600; font-size:14px }
.lab-visor__corpo{ flex:1; min-height:0; display:flex; align-items:center;
  justify-content:center; font-size:13px; color:var(--text-muted) }
.lab-visor__corpo iframe{ border:none; width:100%; height:100%; background:#fff; display:block }
</style>
</head>
