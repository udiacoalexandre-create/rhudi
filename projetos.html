<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udiaço — Projetos Estratégicos</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc,
           deleteDoc, onSnapshot, query, where, orderBy, writeBatch }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Mesmo projeto Firebase do rhudi: os logins da equipe (Auth) e o controle de
  // acesso (coleção 'usuarios') são compartilhados. Aqui só as coleções são novas.
  const firebaseConfig = {
    apiKey:"AIzaSyDUD4CDg3zaZh9dM4_RXuxRmY9bV0YZAok",
    authDomain:"udiaco-beneficios.firebaseapp.com",
    projectId:"udiaco-beneficios",
    storageBucket:"udiaco-beneficios.firebasestorage.app",
    messagingSenderId:"27505050059",
    appId:"1:27505050059:web:1aa59e7b14bdc7b796364e"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app), auth = getAuth(app);

  window._auth = auth;
  window._col  = n => collection(db, n);
  window._doc  = (c, i) => doc(db, c, i);
  window._getDoc = getDoc;  window._getDocs = getDocs;
  window._addDoc = addDoc;  window._setDoc = setDoc;  window._updateDoc = updateDoc;
  window._deleteDoc = deleteDoc;
  window._onSnapshot = onSnapshot;
  window._query = query; window._where = where; window._orderBy = orderBy;
  window._batch = () => writeBatch(db);
  window._signIn = (e, p) => signInWithEmailAndPassword(auth, e, p);
  window._resetSenha = e => sendPasswordResetEmail(auth, e);
  window._signOut = () => signOut(auth);
  window._onAuthStateChanged = onAuthStateChanged;
  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<!-- Sistema de design da Udiaço (o mesmo do rhudi) -->
<link rel="stylesheet" href="udiaco-design-system.css">

<style>
/* ============================================================
   PROJETOS ESTRATÉGICOS — estilos específicos deste app.
   Os tokens (--accent, --border, --space-*, ...) vêm do
   udiaco-design-system.css; aqui só o que é novo: login, agenda,
   painel lateral do ticket, chat, modal.
   ============================================================ */
*{ box-sizing:border-box }
html,body{ margin:0; padding:0; min-height:100% }
button{ font-family:inherit }
a{ color:var(--accent); text-decoration:none }

/* ---------- LOGIN ---------- */
.login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6);
        background:linear-gradient(160deg,#eef2ff 0%,var(--page-bg) 45%) }
.login__card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
        border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:var(--space-8) }
.login__logo{ width:44px; height:44px; border-radius:var(--radius); background:var(--accent);
        color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:22px }

/* ---------- LAYOUT ---------- */
.wrap{ max-width:1180px; margin:0 auto; padding:var(--space-6) }
.row{ display:flex; align-items:center; gap:var(--space-3) }
.row--between{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3) }
.spacer{ flex:1 }
.muted{ color:var(--text-muted) }
.small{ font-size:12px }
.nav__item{ background:none; border:none; border-bottom:2px solid transparent; font-family:inherit }
.nav__count{ background:var(--surface-soft); color:var(--text-secondary); border-radius:20px;
        padding:1px 7px; font-size:11px; font-weight:600 }
.nav__item--active .nav__count{ background:var(--accent); color:var(--on-accent) }

/* ---------- AGENDA (Minhas tarefas) ---------- */
.grupo{ margin-bottom:var(--space-6) }
.grupo__head{ display:flex; align-items:center; gap:var(--space-2); margin:0 0 var(--space-3) }
.grupo__titulo{ font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted) }
.lista{ display:flex; flex-direction:column; gap:var(--space-2) }

.tarefa{ display:flex; align-items:center; gap:var(--space-3); width:100%; text-align:left;
        background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border);
        border-radius:var(--radius); padding:var(--space-3) var(--space-4); cursor:pointer;
        transition:border-color .15s, box-shadow .15s; font-family:inherit; font-size:14px }
.tarefa:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md) }
.tarefa--atrasada{ border-left-color:var(--danger) }
.tarefa--hoje{ border-left-color:var(--accent) }
.tarefa--checar{ border-left-color:var(--purple) }
.tarefa--aguardando{ border-left-color:var(--warning) }
.tarefa--concluida{ opacity:.6 }
.tarefa__main{ flex:1; min-width:0 }
.tarefa__titulo{ font-weight:500; color:var(--text); display:flex; align-items:center; gap:6px }
.tarefa__sub{ font-size:12px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center;
        gap:var(--space-2); flex-wrap:wrap }
.tarefa__dir{ display:flex; align-items:center; gap:var(--space-2); flex-shrink:0 }
.dot{ width:5px; height:5px; border-radius:50%; background:var(--border-strong); flex-shrink:0 }
.pill-nova{ background:var(--accent); color:var(--on-accent); border-radius:20px; padding:1px 7px;
        font-size:10px; font-weight:600 }
.avatar--sm{ width:26px; height:26px; font-size:10px }

/* ---------- PROJETOS ---------- */
.proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:var(--space-4) }
.proj-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
        padding:var(--space-5); cursor:pointer; text-align:left; font-family:inherit;
        transition:border-color .15s, box-shadow .15s; box-shadow:var(--shadow) }
.proj-card:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md) }
.proj-card__nome{ font-size:15px; font-weight:600; color:var(--text) }
.proj-card__desc{ font-size:13px; color:var(--text-secondary); margin:6px 0 var(--space-4);
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.proj-card__pes{ display:flex; gap:var(--space-4); font-size:12px; color:var(--text-muted) }
.proj-card__pes b{ color:var(--text); font-size:15px; font-weight:600; display:block;
        font-variant-numeric:tabular-nums }
.progresso{ height:5px; border-radius:20px; background:var(--surface-soft); overflow:hidden; margin-top:var(--space-4) }
.progresso__fill{ height:100%; background:var(--success); border-radius:20px }

/* ---------- PAINEL LATERAL DO TICKET ---------- */
.backdrop{ position:fixed; inset:0; background:rgba(15,23,42,.35); opacity:0; pointer-events:none;
        transition:opacity .2s; z-index:40 }
.backdrop--on{ opacity:1; pointer-events:auto }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); background:var(--surface);
        border-left:1px solid var(--border); box-shadow:-8px 0 24px rgba(15,23,42,.10);
        transform:translateX(100%); transition:transform .22s ease; z-index:50;
        display:flex; flex-direction:column }
.drawer--on{ transform:translateX(0) }
.drawer__head{ padding:var(--space-4) var(--space-5); border-bottom:1px solid var(--border) }
.drawer__body{ flex:1; overflow-y:auto; padding:var(--space-5) }
.drawer__foot{ border-top:1px solid var(--border); padding:var(--space-3) var(--space-4); background:var(--surface) }
.icon-btn{ width:32px; height:32px; border-radius:var(--radius-sm); border:1px solid transparent;
        background:none; color:var(--text-muted); cursor:pointer; display:inline-flex;
        align-items:center; justify-content:center; font-size:18px }
.icon-btn:hover{ background:var(--surface-soft); color:var(--text) }

.campos{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); margin-bottom:var(--space-5) }
.campo{ background:var(--surface-soft); border-radius:var(--radius); padding:var(--space-3) }
.campo__label{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
        color:var(--text-muted); margin-bottom:4px }
.campo select,.campo input{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm);
        background:var(--surface); height:32px; padding:0 8px; font-size:13px; color:var(--text); font-family:inherit }

/* ---------- CHAT ---------- */
.chat{ display:flex; flex-direction:column; gap:var(--space-3) }
.msg{ max-width:88%; background:var(--surface-soft); border-radius:var(--radius); padding:var(--space-3) }
.msg--mine{ align-self:flex-end; background:var(--accent-bg) }
.msg--sys{ align-self:center; max-width:100%; background:transparent; border:1px dashed var(--border);
        color:var(--text-secondary); font-size:12px; text-align:center; padding:var(--space-2) var(--space-3) }
.msg__meta{ font-size:11px; color:var(--text-muted); margin-bottom:3px }
.msg__texto{ font-size:13px; color:var(--text); white-space:pre-wrap; word-break:break-word }
.anexo{ display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:4px 9px;
        background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
        font-size:12px; color:var(--accent-text); cursor:pointer; text-decoration:none }
.anexo:hover{ border-color:var(--accent) }
.compositor{ display:flex; flex-direction:column; gap:var(--space-2) }
.compositor textarea{ width:100%; min-height:60px; max-height:160px; resize:vertical; padding:var(--space-3);
        border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; font-size:13px;
        color:var(--text); background:var(--surface) }
.compositor textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
.anexos-fila{ display:flex; flex-wrap:wrap; gap:6px }

/* ---------- MODAL ---------- */
.modal{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
        padding:var(--space-5); background:rgba(15,23,42,.35) }
.modal--on{ display:flex }
.modal__card{ width:100%; max-width:480px; max-height:90vh; overflow-y:auto; background:var(--surface);
        border-radius:var(--radius-lg); box-shadow:var(--shadow-md) }
.modal__head{ padding:var(--space-5) var(--space-5) 0; font-size:16px; font-weight:600 }
.modal__body{ padding:var(--space-5) }
.modal__foot{ padding:0 var(--space-5) var(--space-5); display:flex; justify-content:flex-end; gap:var(--space-2) }
.fg{ margin-bottom:var(--space-4) }
.fg label{ display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:6px }
.fg input,.fg select,.fg textarea{ width:100%; border:1px solid var(--border); border-radius:var(--radius);
        background:var(--surface); font-size:14px; color:var(--text); font-family:inherit; padding:9px var(--space-3) }
.fg textarea{ min-height:80px; resize:vertical }
.fg input:focus,.fg select:focus,.fg textarea:focus{ outline:none; border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-bg) }
.erro{ display:none; background:var(--danger-bg); color:var(--danger-text); border-radius:var(--radius);
        padding:var(--space-3); font-size:13px; margin-bottom:var(--space-4) }

/* ---------- DIVERSOS ---------- */
.vazio{ text-align:center; padding:var(--space-8) var(--space-5); color:var(--text-muted) }
.vazio i{ font-size:34px; display:block; margin-bottom:var(--space-3); opacity:.5 }
#toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
        background:var(--text); color:#fff; padding:10px 18px; border-radius:var(--radius);
        font-size:13px; opacity:0; pointer-events:none; transition:all .2s; z-index:80 }
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
@media (max-width:640px){
  .campos{ grid-template-columns:1fr }
  .wrap{ padding:var(--space-4) }
  .nav{ overflow-x:auto }
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login" id="tela-login" style="display:none">
  <div class="login__card">
    <div class="row" style="margin-bottom:var(--space-5)">
      <div class="login__logo"><i class="ti ti-target-arrow"></i></div>
      <div>
        <div style="font-weight:600;font-size:16px">Projetos Estratégicos</div>
        <div class="small muted">Udiaço</div>
      </div>
    </div>
    <div class="erro" id="login-erro"></div>
    <div class="fg">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="nome@udiaco.com.br">
    </div>
    <div class="fg">
      <label for="login-senha">Senha</label>
      <input type="password" id="login-senha" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn btn--primary" id="btn-entrar" style="width:100%;justify-content:center">Entrar</button>
    <div style="text-align:center;margin-top:var(--space-4)">
      <a href="#" id="link-reset" class="small">Esqueci minha senha</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="tela-app" style="display:none">
  <div class="topbar">
    <div class="topbar__brand">
      <div class="topbar__logo"><i class="ti ti-target-arrow"></i></div>
      Projetos Estratégicos
    </div>
    <div class="row">
      <span class="small muted" id="user-info"></span>
      <a class="btn" href="index.html" title="Voltar ao portal"><i class="ti ti-apps"></i> Portal</a>
      <button class="btn" id="btn-sair"><i class="ti ti-logout"></i> Sair</button>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <main id="view"></main>
</div>

<!-- ================= PAINEL DO TICKET ================= -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Detalhe da tarefa"></aside>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal"><div class="modal__card" id="modal-card"></div></div>
<div id="toast"></div>

<script src="projetos.js"></script>
</body>
</html>
