<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Udiaço — Projetos Estratégicos</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc,
           deleteDoc, onSnapshot, query, where, orderBy, writeBatch }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // Mesmo projeto Firebase do rhudi: os logins da equipe (Auth) e o controle de
  // acesso (coleção 'usuarios') são compartilhados. Aqui só as coleções são novas.
  const firebaseConfig = {
    apiKey:"AIzaSyDUD4CDg3zaZh9dM4_RXuxRmY9bV0YZAok",
    authDomain:"udiaco-beneficios.firebaseapp.com",
    projectId:"udiaco-beneficios",
    storageBucket:"udiaco-beneficios.firebasestorage.app",
    messagingSenderId:"27505050059",
    appId:"1:27505050059:web:1aa59e7b14bdc7b796364e"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app), auth = getAuth(app);

  window._auth = auth;
  window._col  = n => collection(db, n);
  window._doc  = (c, i) => doc(db, c, i);
  window._getDoc = getDoc;  window._getDocs = getDocs;
  window._addDoc = addDoc;  window._setDoc = setDoc;  window._updateDoc = updateDoc;
  window._deleteDoc = deleteDoc;
  window._onSnapshot = onSnapshot;
  window._query = query; window._where = where; window._orderBy = orderBy;
  window._batch = () => writeBatch(db);
  window._signIn = (e, p) => signInWithEmailAndPassword(auth, e, p);
  window._resetSenha = e => sendPasswordResetEmail(auth, e);
  window._signOut = () => signOut(auth);
  window._onAuthStateChanged = onAuthStateChanged;
  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<!-- Sistema de design da Udiaço (o mesmo do rhudi) -->
<link rel="stylesheet" href="udiaco-design-system.css">

<style>
/* ============================================================
   PROJETOS ESTRATÉGICOS — estilos específicos deste app.
   Os tokens (--accent, --border, --space-*, ...) vêm do
   udiaco-design-system.css.
   ============================================================ */
*{ box-sizing:border-box }
html,body{ margin:0; padding:0; min-height:100% }
button{ font-family:inherit }
a{ color:var(--accent); text-decoration:none }

/* ---------- LOGIN ---------- */
.login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-6);
        background:linear-gradient(160deg,#eef2ff 0%,var(--page-bg) 45%) }
.login__card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
        border-radius:var(--radius-lg); box-shadow:var(--shadow-md); padding:var(--space-8) }
.login__logo{ width:44px; height:44px; border-radius:var(--radius); background:var(--accent);
        color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:22px }

/* ---------- LAYOUT ---------- */
.wrap{ max-width:1240px; margin:0 auto; padding:var(--space-6) }
.row{ display:flex; align-items:center; gap:var(--space-3) }
.row--between{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-3) }
.spacer{ flex:1 }
.muted{ color:var(--text-muted) }
.small{ font-size:12px }
.nav__item{ background:none; border:none; border-bottom:2px solid transparent; font-family:inherit }
.nav__count{ background:var(--surface-soft); color:var(--text-secondary); border-radius:20px;
        padding:1px 7px; font-size:11px; font-weight:600 }
.nav__item--active .nav__count{ background:var(--accent); color:var(--on-accent) }

/* ---------- AVATAR COM FOTO ---------- */
.avatar{ overflow:hidden; position:relative }
.avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.avatar--sm{ width:26px; height:26px; font-size:10px }
.avatar--lg{ width:44px; height:44px; font-size:14px }
.avatar-btn{ border:none; background:none; padding:0; cursor:pointer; border-radius:50%; line-height:0 }
.avatar-btn:hover{ box-shadow:0 0 0 3px var(--accent-bg) }

/* ---------- SINO DE NOTIFICAÇÕES ---------- */
.sino{ position:relative }
.sino__badge{ position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px;
        border-radius:20px; background:var(--danger); color:#fff; font-size:10px; font-weight:600;
        display:flex; align-items:center; justify-content:center }
.notif-painel{ position:absolute; top:46px; right:var(--space-6); width:min(420px,calc(100vw - 32px));
        max-height:70vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border);
        border-radius:var(--radius-lg); box-shadow:var(--shadow-md); z-index:70; display:none }
.notif-painel--on{ display:block }
.notif{ display:flex; gap:var(--space-3); width:100%; text-align:left; padding:var(--space-3) var(--space-4);
        border:none; border-bottom:1px solid var(--border); background:none; cursor:pointer; font-family:inherit }
.notif:hover{ background:var(--surface-soft) }
.notif--nova{ background:var(--accent-bg) }
.notif--nova:hover{ background:#e0ecfe }
.notif__txt{ flex:1; min-width:0; font-size:13px; color:var(--text) }
.notif__sub{ font-size:11px; color:var(--text-muted); margin-top:2px }

/* ---------- AGENDA ---------- */
.grupo{ margin-bottom:var(--space-6) }
.grupo__head{ display:flex; align-items:center; gap:var(--space-2); margin:0 0 var(--space-3) }
.grupo__titulo{ font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted) }
.lista{ display:flex; flex-direction:column; gap:var(--space-2) }
.item{ display:flex; align-items:center; gap:var(--space-3); background:var(--surface);
        border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius);
        padding:var(--space-3) var(--space-4); cursor:pointer; transition:border-color .15s, box-shadow .15s }
.item:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-md) }
.item--atrasada{ border-left-color:var(--danger) }
.item--hoje{ border-left-color:var(--accent) }
.item--checar{ border-left-color:var(--purple) }
.item--aguardando{ border-left-color:var(--warning) }
.item--concluida{ opacity:.6 }
.item__main{ flex:1; min-width:0 }
.item__tit{ font-weight:500; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.item__sub{ font-size:12px; color:var(--text-muted); margin-top:3px; display:flex; align-items:center;
        gap:var(--space-2); flex-wrap:wrap }
.dot{ width:5px; height:5px; border-radius:50%; background:var(--border-strong); flex-shrink:0 }
.pill{ border-radius:20px; padding:1px 7px; font-size:10px; font-weight:600 }
.pill--nova{ background:var(--accent); color:var(--on-accent) }
.reprog{ display:flex; align-items:center; gap:5px; background:var(--surface-soft); border:1px solid var(--border);
        border-radius:var(--radius-sm); padding:3px 7px; font-size:11px; color:var(--text-secondary) }
.reprog input{ border:none; background:transparent; font-family:inherit; font-size:11px; color:var(--text);
        width:88px; outline:none; padding:0 }

/* ---------- TABELA DE PROJETO ---------- */
.proj-bloco{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
        box-shadow:var(--shadow); margin-bottom:var(--space-5); overflow:hidden }
.proj-bloco__head{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4) var(--space-5);
        border-bottom:1px solid var(--border); flex-wrap:wrap }
.proj-bloco__nome{ font-size:15px; font-weight:600; color:var(--text); cursor:pointer;
        display:flex; align-items:center; gap:8px; background:none; border:none; font-family:inherit; padding:0 }
.proj-bloco__nome:hover{ color:var(--accent) }
.tab-wrap{ overflow-x:auto }
.tab{ width:100%; border-collapse:collapse; font-size:13px }
.tab th{ text-align:left; padding:9px var(--space-4); font-weight:500; font-size:11px; letter-spacing:.04em;
        text-transform:uppercase; color:var(--text-muted); background:var(--surface-soft);
        border-bottom:1px solid var(--border); white-space:nowrap }
.tab td{ padding:9px var(--space-4); border-bottom:1px solid var(--border); color:var(--text-secondary);
        vertical-align:middle }
.tab tbody tr{ cursor:pointer }
.tab tbody tr:hover td{ background:var(--surface-soft) }
.tab tr.lin--concluida td{ opacity:.55 }
.tab .cel-dem{ min-width:260px }
.tab .cel-resp{ white-space:nowrap }
.demanda{ display:flex; align-items:flex-start; gap:8px }
.demanda__tit{ color:var(--text); font-weight:500 }
.demanda__sub{ font-size:11px; color:var(--text-muted); margin-top:1px }
.ramo{ color:var(--text-muted); flex-shrink:0 }
.nivel-1 .demanda{ padding-left:22px }
.nivel-2 .demanda{ padding-left:44px }
.data-cel{ white-space:nowrap; font-variant-numeric:tabular-nums }
.data-cel--vencida{ color:var(--danger-text); font-weight:600 }
.data-cel--hoje{ color:var(--accent-text); font-weight:600 }
.data-cel--risco{ color:var(--warning-text); font-weight:600 }
.mini-pes{ display:flex; align-items:center; gap:7px }

/* ---------- PAINEL DO TICKET ---------- */
.backdrop{ position:fixed; inset:0; background:rgba(15,23,42,.35); opacity:0; pointer-events:none;
        transition:opacity .2s; z-index:40 }
.backdrop--on{ opacity:1; pointer-events:auto }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(620px,100%); background:var(--surface);
        border-left:1px solid var(--border); box-shadow:-8px 0 24px rgba(15,23,42,.10);
        transform:translateX(100%); transition:transform .22s ease; z-index:50;
        display:flex; flex-direction:column }
.drawer--on{ transform:translateX(0) }
.drawer__body{ flex:1; overflow-y:auto }
.icon-btn{ width:32px; height:32px; border-radius:var(--radius-sm); border:1px solid transparent;
        background:none; color:var(--text-muted); cursor:pointer; display:inline-flex;
        align-items:center; justify-content:center; font-size:18px }
.icon-btn:hover{ background:var(--surface-soft); color:var(--text) }

/* Cabeçalho enxuto: contexto pequeno, título, e uma linha de chips */
.tk-head{ padding:var(--space-4) var(--space-5) var(--space-4); border-bottom:1px solid var(--border) }
.tk-ctx{ font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.tk-tit{ font-size:17px; font-weight:600; line-height:1.35; color:var(--text); margin:6px 0 0;
        display:flex; align-items:flex-start; gap:8px }
.tk-tit__edit{ opacity:0; transition:opacity .15s }
.tk-head:hover .tk-tit__edit{ opacity:1 }
.tk-chips{ display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; margin-top:var(--space-3) }
.chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-soft);
        border:1px solid var(--border); border-radius:20px; padding:3px 10px 3px 4px; font-size:12px;
        color:var(--text-secondary); cursor:pointer }
.chip:hover{ border-color:var(--border-strong) }
.chip--plain{ padding-left:10px }
.chip b{ color:var(--text); font-weight:500 }

/* Bloco de situação */
.sec{ padding:var(--space-5); border-bottom:1px solid var(--border) }
.sec__lab{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
        color:var(--text-muted); margin-bottom:var(--space-3) }
.sit{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden }
.sit__topo{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-4);
        background:var(--surface-soft) }
.sit__txt{ flex:1; min-width:0; font-size:13px; color:var(--text-secondary) }
.sit__acoes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--space-2);
        padding:var(--space-3) }
.acao{ display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--border-strong);
        border-radius:var(--radius); background:var(--surface); font-size:13px; font-weight:500;
        color:var(--text); cursor:pointer; font-family:inherit; text-align:left }
.acao:hover{ background:var(--surface-soft) }
.acao--ativa{ border-color:var(--accent); color:var(--accent-text); background:var(--accent-bg) }
.acao--ok{ border-color:var(--success); color:#fff; background:var(--success) }
.acao--ok:hover{ filter:brightness(1.06); background:var(--success) }
.acao i{ font-size:16px }

/* Campos e listas dentro do ticket */
.campos{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3) }
.campo{ background:var(--surface-soft); border-radius:var(--radius); padding:var(--space-3) }
.campo__label{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
        color:var(--text-muted); margin-bottom:5px }
.campo select,.campo input{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm);
        background:var(--surface); height:32px; padding:0 8px; font-size:13px; color:var(--text); font-family:inherit }
.mini-lista{ display:flex; flex-direction:column; gap:6px }
.mini{ display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--border);
        border-radius:var(--radius); background:var(--surface); cursor:pointer; font-size:13px }
.mini:hover{ border-color:var(--border-strong) }
.mini__tit{ flex:1; min-width:0; color:var(--text) }

/* ---------- CHAT (mais novo no topo) ---------- */
.compositor{ display:flex; flex-direction:column; gap:var(--space-2); background:var(--surface-soft);
        border:1px solid var(--border); border-radius:var(--radius); padding:var(--space-3) }
.compositor textarea{ width:100%; min-height:64px; max-height:200px; resize:vertical; padding:var(--space-3);
        border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; font-size:13px;
        color:var(--text); background:var(--surface) }
.compositor textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg) }
.fila{ display:flex; flex-wrap:wrap; gap:6px }
.anexo{ display:inline-flex; align-items:center; gap:6px; padding:4px 9px; background:var(--surface);
        border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12px;
        color:var(--accent-text); cursor:pointer; text-decoration:none }
.anexo:hover{ border-color:var(--accent) }
.tag-pessoa{ display:inline-flex; align-items:center; gap:5px; background:var(--purple-bg);
        color:var(--purple-text); border-radius:20px; padding:2px 8px; font-size:11px; font-weight:500; cursor:pointer }

.linha-tempo{ display:flex; flex-direction:column; gap:var(--space-3); margin-top:var(--space-4) }
.ev{ display:flex; gap:var(--space-3) }
.ev__col{ display:flex; flex-direction:column; align-items:center; flex-shrink:0 }
.ev__linha{ flex:1; width:1px; background:var(--border); margin-top:4px }
.ev__corpo{ flex:1; min-width:0; padding-bottom:var(--space-2) }
.ev__meta{ font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.ev__nome{ font-weight:600; color:var(--text); font-size:12px }
.ev__texto{ font-size:13px; color:var(--text); white-space:pre-wrap; word-break:break-word; margin-top:3px }
.ev__caixa{ background:var(--surface-soft); border-radius:var(--radius); padding:var(--space-3); margin-top:4px }
.ev--sys .ev__texto{ color:var(--text-secondary); font-size:12px }
.ev--nova .ev__caixa{ background:var(--accent-bg) }
.marca-sys{ width:26px; height:26px; border-radius:50%; background:var(--surface-soft); color:var(--text-muted);
        display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0 }

/* ---------- MODAL ---------- */
.modal{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
        padding:var(--space-5); background:rgba(15,23,42,.35) }
.modal--on{ display:flex }
.modal__card{ width:100%; max-width:500px; max-height:90vh; overflow-y:auto; background:var(--surface);
        border-radius:var(--radius-lg); box-shadow:var(--shadow-md) }
.modal__head{ padding:var(--space-5) var(--space-5) 0; font-size:16px; font-weight:600 }
.modal__body{ padding:var(--space-5) }
.modal__foot{ padding:0 var(--space-5) var(--space-5); display:flex; justify-content:flex-end; gap:var(--space-2) }
.fg{ margin-bottom:var(--space-4) }
.fg label{ display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:6px }
.fg input,.fg select,.fg textarea{ width:100%; border:1px solid var(--border); border-radius:var(--radius);
        background:var(--surface); font-size:14px; color:var(--text); font-family:inherit; padding:9px var(--space-3) }
.fg textarea{ min-height:80px; resize:vertical }
.fg input:focus,.fg select:focus,.fg textarea:focus{ outline:none; border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-bg) }
.fg-dupla{ display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3) }
.ajuda{ font-size:11px; color:var(--text-muted); margin-top:4px }
.erro{ display:none; background:var(--danger-bg); color:var(--danger-text); border-radius:var(--radius);
        padding:var(--space-3); font-size:13px; margin-bottom:var(--space-4) }

/* ---------- DIVERSOS ---------- */
.vazio{ text-align:center; padding:var(--space-8) var(--space-5); color:var(--text-muted) }
.vazio i{ font-size:34px; display:block; margin-bottom:var(--space-3); opacity:.5 }
#toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
        background:var(--text); color:#fff; padding:10px 18px; border-radius:var(--radius);
        font-size:13px; opacity:0; pointer-events:none; transition:all .2s; z-index:90; max-width:90vw }
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
@media (max-width:700px){
  .campos,.fg-dupla{ grid-template-columns:1fr }
  .wrap{ padding:var(--space-4) }
  .nav{ overflow-x:auto }
  .notif-painel{ right:var(--space-3) }
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login" id="tela-login" style="display:none">
  <div class="login__card">
    <div class="row" style="margin-bottom:var(--space-5)">
      <div class="login__logo"><i class="ti ti-target-arrow"></i></div>
      <div>
        <div style="font-weight:600;font-size:16px">Projetos Estratégicos</div>
        <div class="small muted">Udiaço</div>
      </div>
    </div>
    <div class="erro" id="login-erro"></div>
    <div class="fg">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="nome@udiaco.com.br">
    </div>
    <div class="fg">
      <label for="login-senha">Senha</label>
      <input type="password" id="login-senha" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn btn--primary" id="btn-entrar" style="width:100%;justify-content:center">Entrar</button>
    <div style="text-align:center;margin-top:var(--space-4)">
      <a href="#" id="link-reset" class="small">Esqueci minha senha</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="tela-app" style="display:none">
  <div class="topbar">
    <div class="topbar__brand">
      <div class="topbar__logo"><i class="ti ti-target-arrow"></i></div>
      Projetos Estratégicos
    </div>
    <div class="row">
      <button class="icon-btn sino" id="btn-sino" title="Notificações">
        <i class="ti ti-bell"></i><span class="sino__badge" id="sino-badge" style="display:none">0</span>
      </button>
      <button class="avatar-btn" id="btn-minha-foto" title="Trocar minha foto"></button>
      <span class="small muted" id="user-info"></span>
      <a class="btn" href="index.html" title="Voltar ao portal"><i class="ti ti-apps"></i></a>
      <button class="btn" id="btn-sair" title="Sair"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div class="notif-painel" id="notif-painel"></div>
  <div class="nav" id="nav"></div>
  <main id="view"></main>
</div>

<!-- ================= PAINEL DO TICKET ================= -->
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Detalhe da tarefa"></aside>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal"><div class="modal__card" id="modal-card"></div></div>
<div id="toast"></div>
<input type="file" id="foto-input" accept="image/*" style="display:none">

<script src="projetos.js"></script>
</body>
</html>
